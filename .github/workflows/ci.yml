name: build-and-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      ETP_TEST_SQL_CONNECTION: "Server=(localdb)\\MSSQLLocalDB;Integrated Security=True;TrustServerCertificate=True;Connect Timeout=5"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Etp.Reporting.slnx
      - name: Check operational PowerShell syntax
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File -Recurse | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$fileErrors) | Out-Null
            $parseErrors += $fileErrors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'Operational PowerShell syntax validation failed.'
          }
      - name: Build
        run: dotnet build Etp.Reporting.slnx --configuration Release --no-restore
      - name: Start isolated SQL test instance
        run: sqllocaldb start MSSQLLocalDB
      - name: Run .NET connection, permissions and recovery boundary tests
        run: dotnet test Etp.Reporting.slnx --configuration Release --no-build --filter "FullyQualifiedName~PhaseFourBoundaryTests|FullyQualifiedName~PhaseFourSecurityTests|FullyQualifiedName~PhaseFourOperationsStatusTests|FullyQualifiedName~PhaseFourRecoveryTests|FullyQualifiedName~OperationsScriptBoundaryTests"
      - name: Run full .NET test suite
        run: dotnet test Etp.Reporting.slnx --configuration Release --no-build
      - name: Check changed lines for whitespace errors
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIFF_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ($env:EVENT_NAME -eq 'pull_request') {
            git diff --check "$env:DIFF_BASE...$env:GITHUB_SHA"
          }
          elseif ([string]::IsNullOrWhiteSpace($env:DIFF_BASE) -or $env:DIFF_BASE -match '^0+$') {
            git diff-tree --check --root --no-commit-id $env:GITHUB_SHA
          }
          else {
            git diff --check "$env:DIFF_BASE..$env:GITHUB_SHA"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
      - name: Run fail-closed dependency security scan
        shell: pwsh
        run: ./scripts/invoke-security-scan.ps1 -OutputPath artifacts/security-scan.json
      - name: Upload dependency security scan evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-security-scan-${{ github.run_id }}
          path: artifacts/security-scan.json
          if-no-files-found: error
