name: build-and-test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Etp.Reporting.slnx
      - name: Build
        run: dotnet build Etp.Reporting.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test Etp.Reporting.slnx --configuration Release --no-build
