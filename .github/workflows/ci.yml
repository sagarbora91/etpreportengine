name: build-and-test

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      # Test runs must never write to a real diagnostics log.
      ETP_DIAGNOSTICS_DIRECTORY: ${{ runner.temp }}\etp-diagnostics
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: |
            **/*.csproj
            Directory.Build.props
      - name: Restore
        run: dotnet restore Etp.Reporting.slnx
      - name: Check operational PowerShell syntax
        shell: pwsh
        run: |
          $parseErrors = @()
          Get-ChildItem -LiteralPath scripts -Filter '*.ps1' -File -Recurse | ForEach-Object {
            $tokens = $null
            $fileErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$fileErrors) | Out-Null
            $parseErrors += $fileErrors
          }
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            throw 'Operational PowerShell syntax validation failed.'
          }
      - name: Build
        run: dotnet build Etp.Reporting.slnx --configuration Release --no-restore
      # Unit test projects only. Etp.Reporting.SqlServer.IntegrationTests needs a
      # local elevated SQL Server and is deliberately never run here.
      - name: Unit tests
        shell: pwsh
        run: |
          $projects = @(
            'Etp.Reporting.Domain.Tests',
            'Etp.Reporting.Import.Tests',
            'Etp.Reporting.Reporting.Tests',
            'Etp.Reporting.SqlServer.Tests',
            'Etp.Reporting.Desktop.Tests'
          )
          $failed = @()
          foreach ($p in $projects) {
            dotnet test "tests-dotnet/$p/$p.csproj" --configuration Release --no-build `
              --logger "trx;LogFileName=$p.trx" --results-directory "$env:RUNNER_TEMP/trx" `
              --blame-hang-timeout 10m --blame-hang-dump-type none
            if ($LASTEXITCODE -ne 0) { $failed += $p }
          }
          if ($failed.Count -gt 0) { throw "Failed test projects: $($failed -join ', ')" }
      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ github.run_id }}
          path: ${{ runner.temp }}/trx/*.trx
          if-no-files-found: warn
