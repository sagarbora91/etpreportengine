  }
  var a=L(K.audit,[]);
  document.getElementById('auditC').innerHTML=
  '<div class="card"><div class="card-h"><div><h3>Audit trail</h3><p>'+a.length+' event(s). Every create / edit / void / close / reopen / sync / month-lock.</p></div>'+
   '<div class="actions"><button data-action="export-audit-csv" class="btn sm" onclick="exportAuditCSV()">⇩ CSV</button></div></div>'+
   (a.length?'<div class="twrap"><table data-saagar-table-strategy="grid" data-saagar-table-workflow="audit" data-saagar-grid-reason="audit review requires chronological cross-column comparison"><thead><tr><th>When</th><th>Role</th><th>Action</th><th>Detail</th></tr></thead><tbody>'+
     a.slice(0,300).map(function(x){return '<tr><td class="small">'+(x.at||'').slice(0,16).replace('T',' ')+'</td><td><span class="bdg src">'+esc(x.by)+'</span></td><td>'+esc(x.action)+'</td><td class="small">'+esc(x.detail)+'</td></tr>';}).join('')+
     '</tbody></table></div>':'<div class="empty">No audit events yet.</div>')+
  '</div>';
}
function exportAuditCSV(){ var rows=[['When','Role','Action','Detail']]; L(K.audit,[]).forEach(function(x){rows.push([x.at,x.by,x.action,x.detail]);}); dlCSV('expense_audit_'+todayStr()+'.csv',rows); }

/* ═══════════════ MODAL ═══════════════ */
/* ═══════════════ UDHAAR / CREDIT LEDGER (Wave 3) ═══════════════
   A standalone receivables register for customers who buy on trust. INTENTIONALLY
   isolated from gm_expenses: creating or settling a receivable NEVER posts to the
   cash ledger, so outstanding credit can never inflate income. When the money is
   actually received, the owner records it in the Ledger tab as normal income.
   Dedicated key saagar_udhaar_ledger_v1 (registered in the shell's Expense
   STORAGE_RULES so it is backed up / factory-reset with this module). */
function getUdhaar(){ var u=L(K.udhaar,null); if(!u||typeof u!=='object'||!Array.isArray(u.receivables)) u={version:1,receivables:[]}; return u; }
function saveUdhaar(u){ u.version=1; S(K.udhaar,u); }
function udPaid(r){ return (r.settlements||[]).reduce(function(s,x){return s+num(x.amount);},0); }
function udOut(r){ var o=num(r.amount)-udPaid(r); return o>0?o:0; }
function udDaysSince(d){ try{ var a=new Date(d+'T00:00:00'), b=new Date(todayStr()+'T00:00:00'); return Math.round((b-a)/86400000); }catch(e){ return 0; } }
function udOverdue(r){ return r.dueDate && todayStr()>r.dueDate; }
function udBucket(r){ var d=udDaysSince(r.date); return d<=30?'0–30':(d<=60?'31–60':'60+'); }
function udKnownCustomers(){ var cm=L('saagar_customer_master_v1',null), out=[];
  if(cm&&cm.byMobile) Object.keys(cm.byMobile).forEach(function(m){ var e=cm.byMobile[m]; out.push({mobile:m,name:(e.names&&e.names[0])||''}); });
  return out; }
function addReceivable(){
  if(isPast()){ toast('Switch the view date to today to add','warn'); return; }
  var name=(val('ud_name')||'').trim(), mob=(val('ud_mob')||'').replace(/\D/g,''), amt=num(val('ud_amt')), due=val('ud_due')||'', note=(val('ud_note')||'').trim();
  if(!name){ toast('Customer name is required','warn'); return; }
  if(amt<=0){ toast('Enter a valid amount','warn'); return; }
  var m10=mob.length>=10?mob.slice(-10):'';
  var u=getUdhaar();
  u.receivables.push({ id:uid('ud'), custId:m10?('c_'+m10):'', name:name, mobile:m10, amount:amt, date:todayStr(), dueDate:due, note:note, settlements:[], createdBy:role() });
  saveUdhaar(u); audit('udhaar.add', name+' '+nINR(amt)); toast('Credit recorded','ok');
  ['ud_name','ud_mob','ud_amt','ud_note'].forEach(function(id){ var el=document.getElementById(id); if(el) el.value=''; });
  renderUdhaar();
}
function payReceivable(id){
  if(isPast()){ toast('Switch to today to record a payment','warn'); return; }
  var u=getUdhaar(), r=u.receivables.find(function(x){return x.id===id;}); if(!r) return;
  var out=udOut(r);
  modal('Record payment — '+esc(r.name),
    '<div class="fgrid">'+
      fld('Outstanding','<input value="'+nINR(out)+'" disabled>')+
      fld('Amount received (₹)','<input id="ud_pay_amt" type="number" min="0" step="0.01" value="'+out+'">')+
      fld('Mode','<select id="ud_pay_mode">'+MODES.map(function(m){return '<option>'+m+'</option>';}).join('')+'</select>')+
    '</div><p class="small muted">Recorded against this credit only. If you want the cash to appear in the day’s cash statement, also add it as Income in the Ledger tab.</p>',
    function(){ var a=num((document.getElementById('ud_pay_amt')||{}).value); if(a<=0){ toast('Enter an amount','warn'); return false; }
      if(a>out+0.5){ toast('More than outstanding — capped','warn'); a=out; }
      r.settlements=r.settlements||[];
      r.settlements.push({amount:a,date:todayStr(),mode:(document.getElementById('ud_pay_mode')||{}).value||'Cash',by:role()});
      saveUdhaar(u); audit('udhaar.pay', r.name+' '+nINR(a)); toast('Payment recorded','ok'); renderUdhaar(); });
}
function voidReceivable(id){
  if(isPast()){ toast('Switch to today','warn'); return; }
  var u=getUdhaar(), r=u.receivables.find(function(x){return x.id===id;}); if(!r) return;
  modal('Remove / write off — '+esc(r.name),
    '<p>Outstanding <b>'+nINR(udOut(r))+'</b>. This hides the entry from the outstanding list (kept for audit).</p>'+
    '<div class="fgrid">'+fld('Reason','<input id="ud_void_rsn" placeholder="e.g. written off, entered in error">')+'</div>',
    function(){ r.void=true; r.voidReason=(document.getElementById('ud_void_rsn')||{}).value||''; r.voidAt=todayStr();
      saveUdhaar(u); audit('udhaar.void', r.name+' — '+(r.voidReason||'')); toast('Removed from outstanding','ok'); renderUdhaar(); });
}
function remindReceivable(id){
  var u=getUdhaar(), r=u.receivables.find(function(x){return x.id===id;}); if(!r) return;
  var out=udOut(r);
  var msg='Namaste '+r.name+',\nA gentle reminder from Saagar Traders, Latur regarding your pending balance of '+nINR(out)+(r.dueDate?(' (due '+r.dueDate+')'):'')+'.\nKindly clear it at your convenience. Thank you.';
  // Prefer the shell's proven offline share rail (OS share sheet → WhatsApp), matching how this
  // module already sends messages (shareEntry). wa.me is a best-effort fallback if it isn't present.
  try{ if(typeof parent!=='undefined' && parent && parent!==window && typeof SaagarModuleBridge.shareText==='function'){ SaagarModuleBridge.shareText(msg,'udhaar'); return; } }catch(e){}
  toast('Controlled sharing is available only inside Saagar Control Centre.','warn');
}
function renderUdhaar(){
  var u=getUdhaar();
  var open=u.receivables.filter(function(r){return !r.void && udOut(r)>0;});
  var totalOut=open.reduce(function(s,r){return s+udOut(r);},0);
  var buckets={'0–30':0,'31–60':0,'60+':0}; open.forEach(function(r){ buckets[udBucket(r)]+=udOut(r); });
  open.sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });   // oldest first
  var custs=udKnownCustomers();
  var dlist='<datalist id="ud_names">'+custs.map(function(c){return '<option value="'+esc(c.name)+'">'+esc(c.mobile)+'</option>';}).join('')+'</datalist>';
  var defDue=(function(){ var d=new Date(); d.setDate(d.getDate()+30); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); })();
  var form = isPast()
    ? '<div class="card"><div class="card-h"><div><h3>Udhaar / Credit</h3><p>Read-only historical view.</p></div></div>'+
      '<div class="banner lock">🔒 <div>Viewing <b>'+asOf()+'</b> (past). Switch the view date to today to record credit or payments.</div></div></div>'
    : '<div class="card"><div class="card-h"><div><h3>Record a credit sale</h3><p>Goods given on trust. Tracked here only — never added to cash or income until you receive it.</p></div></div>'+
      '<div class="fgrid">'+
        fld('Customer name <span style="color:#dc2626">*</span>','<input id="ud_name" list="ud_names" placeholder="name">'+dlist)+
        fld('Mobile','<input id="ud_mob" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit">')+
        fld('Amount (₹) <span style="color:#dc2626">*</span>','<input id="ud_amt" type="number" min="0" step="0.01" placeholder="0.00">')+
        fld('Due date','<input id="ud_due" type="date" value="'+defDue+'">')+
        fld('Note','<input id="ud_note" placeholder="e.g. Titan Raga, promised in 30 days">','full')+
      '</div>'+
      '<div class="row" style="margin-top:14px"><button data-action="add-receivable" class="btn p" onclick="addReceivable()">Add credit</button><span class="small muted">Isolated from the cash ledger — this is your receivables diary.</span></div></div>';
  var summary='<div class="card"><div class="card-h"><div><h3>Outstanding</h3><p>Total money owed to you</p></div><div class="actions"><b style="font-size:20px">'+nINR(totalOut)+'</b></div></div>'+
    '<div class="row" style="gap:8px;flex-wrap:wrap;margin-top:4px">'+
      '<span class="bdg">0–30 days · '+nINR(buckets['0–30'])+'</span>'+
      '<span class="bdg warn">31–60 · '+nINR(buckets['31–60'])+'</span>'+
      '<span class="bdg'+(buckets['60+']>0?' void':'')+'">60+ · '+nINR(buckets['60+'])+'</span>'+
    '</div></div>';
  var list = open.length
    ? '<div class="card"><div class="card-h"><div><h3>Who owes you</h3><p>Oldest first · '+open.length+' open</p></div></div>'+
      '<div class="twrap"><table data-saagar-table-strategy="cards" data-saagar-table-workflow="receivables"><thead><tr><th>Customer</th><th>Since</th><th>Due</th><th class="num">Amount</th><th class="num">Paid</th><th class="num">Outstanding</th><th></th></tr></thead><tbody>'+
      open.map(function(r){ return '<tr>'+
        '<td><b>'+esc(r.name)+'</b>'+(r.mobile?'<br><span class="muted small">'+esc(r.mobile)+'</span>':'')+(r.note?'<br><span class="muted small">'+esc(r.note)+'</span>':'')+'</td>'+
        '<td>'+esc(r.date)+'</td>'+
        '<td>'+(r.dueDate?(esc(r.dueDate)+(udOverdue(r)?' <span class="bdg void">overdue</span>':'')):'—')+'</td>'+
        '<td class="num">'+nINR(r.amount)+'</td>'+
        '<td class="num">'+nINR(udPaid(r))+'</td>'+
        '<td class="num"><b>'+nINR(udOut(r))+'</b></td>'+
        '<td class="num">'+(isPast()?'<span class="bdg locked">🔒</span>':'<button data-action="pay-receivable" data-saagar-args="'+jargs(r.id)+'" class="btn xs p">Pay</button> <button data-action="remind-receivable" data-saagar-args="'+jargs(r.id)+'" class="btn xs">Remind</button> <button data-action="void-receivable" data-saagar-args="'+jargs(r.id)+'" class="btn xs red">✕</button>')+'</td>'+
        '</tr>'; }).join('')+'</tbody></table></div></div>'
    : '<div class="card"><div class="empty">No outstanding credit. Everyone has paid up. 🎉</div></div>';
  document.getElementById('udhaarC').innerHTML = form+summary+list;
}

function modal(title,bodyHtml,onOk){
  var r=document.getElementById('modalRoot');
  r.innerHTML='<div class="mbk" id="mbk"><div class="modal"><div class="modal-h"><h3>'+esc(title)+'</h3><button data-action="close-generated-modal" class="btn xs" onclick="closeModal()">✕</button></div><div class="modal-b">'+bodyHtml+'<div class="row" style="margin-top:16px;justify-content:flex-end"><button data-action="cancel-generated-modal" class="btn" onclick="closeModal()">Cancel</button><button data-action="confirm-generated-modal" class="btn p" id="mok">Confirm</button></div></div></div></div>';
  document.getElementById('mok').onclick=async function(){ if((await Promise.resolve(onOk()))!==false) closeModal(); };
  document.getElementById('mbk').addEventListener('click',function(e){ if(e.target.id==='mbk') closeModal(); });
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }

/* ═══════════════ INIT ═══════════════ */
migrateOnce();
// Seed the date-bound pickers from the shell view-date (asOf) at startup.
// asOf() already reflects window.__stAsOf (seeded before this script runs);
// SD/CM were initialised from it above — re-assert here for clarity/safety.
SD=asOf(); CM=ym(asOf());
var ExpenseDelegatedHandlers=Object.freeze({
  viewPhoto:viewPhoto,shareEntry:shareEntry,approveEntry:approveEntry,editEntry:editEntry,voidEntry:voidEntry,
  postRecurring:postRecurring,editRecTpl:editRecTpl,toggleRecTpl:toggleRecTpl,delRecTpl:delRecTpl,
  setSST:setSST,approveStoreDay:approveStoreDay,reopenStoreDay:reopenStoreDay,closeStoreDay:closeStoreDay,
  postSrc:postSrc,payReceivable:payReceivable,remindReceivable:remindReceivable,voidReceivable:voidReceivable
});
if(typeof SaagarRenderedComponents!=='undefined')SaagarRenderedComponents.connect(document.body,ExpenseRenderedPolicy,ExpenseDelegatedHandlers);
render();
window.addEventListener('storage',function(){ render(); });
// VIEW-DATE RAIL: the shell broadcasts the day the user wants to view.
// Re-point the date-bound pickers (SD = cash statement, CM = month close) to
// the new date and re-render the active view. Dashboard / Ledger / Budget read
// asOf() live, so render() refreshes them too. On 'today' this is a no-op change.
window.addEventListener('st-date',function(e){
  var nd=(e&&e.detail);
  if(validDate(nd)){ window.__stAsOf=nd; }      // mirror into the rail var the module reads
  SD=asOf(); CM=ym(asOf());
  render();
});
