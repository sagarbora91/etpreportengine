<style>
:root{
  --navy:#0d2340; --navy-mid:#1a3a5c; --navy-light:#264d7a;
  --gold:#b8922a; --gold-light:#d4a843; --gold-pale:#fdf6e3;
  --cream:#faf8f3; --paper:#ffffff;
  --red:#b91c1c; --red-pale:#fef2f2; --amber:#b45309; --amber-pale:#fffbeb;
  --green:#166534; --green-pale:#f0fdf4; --blue:#1d4ed8; --blue-pale:#eff6ff;
  --gray-50:#fafafa; --gray-100:#f4f4f5; --gray-200:#e4e4e7; --gray-300:#d4d4d8;
  --gray-400:#a1a1aa; --gray-500:#71717a; --gray-600:#52525b; --gray-700:#3f3f46; --gray-800:#27272a;
  --radius:10px; --radius-lg:16px;
  --font-sans:'DM Sans',system-ui,'Segoe UI',Roboto,Arial,sans-serif;
  --font-serif:'DM Serif Display',Georgia,'Times New Roman',serif;
  /* derived tokens — semantic tints/elevation kept on top of the shared scale */
  --green-mid:#bbf7d0; --purple:#7c3aed; --purple-pale:#f5f3ff;
  --red-border:#fecaca; --blue-border:#bfdbfe; --amber-border:#fed7aa; --purple-border:#ddd6fe;
  --shadow:0 2px 12px rgba(13,35,64,.08); --shadow-lg:0 12px 30px rgba(13,35,64,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--cream);color:var(--gray-800);font-size:14px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{font-family:var(--font-serif);color:var(--navy);font-weight:400;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
button:disabled{opacity:.5;cursor:not-allowed}
.hide{display:none!important}
.mono{font-variant-numeric:tabular-nums}

/* HEADER */
.hdr{background:var(--navy);color:var(--paper);padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hdr .logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--gold),var(--gold-light));background-color:var(--gold);display:grid;place-items:center;font-family:var(--font-serif);color:var(--navy);font-size:18px}
.hdr h1{color:var(--paper);font-size:18px}
.hdr .sub{color:var(--gold-light);font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase}
.hdr-badge{background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;letter-spacing:.5px;text-transform:uppercase}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.role-sel{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);border-radius:8px;padding:5px 9px;font-size:12px}
.role-sel label{color:rgba(255,255,255,.6);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.role-sel select{background:transparent;color:var(--paper);border:none;outline:none;font-weight:600}
.role-sel select option{color:var(--navy)}

/* TABS */
.tabs{background:var(--navy-mid);display:flex;overflow-x:auto;padding:0 8px}
.tab{color:rgba(255,255,255,.72);padding:12px 16px;font-size:13px;font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:all .12s}
.tab:hover{color:var(--paper)}
.tab.active{color:var(--gold-light);border-bottom-color:var(--gold-light)}
.tab .pill{background:var(--gold);color:var(--navy);font-size:11px;font-weight:700;border-radius:999px;padding:1px 6px;margin-left:5px}
.tab .pill.red{background:var(--red);color:var(--paper)}

/* WRAP */
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.sec{display:none}
.sec.active{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* CARDS */
.card{background:var(--paper);border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h3{font-size:18px}
.card-h p{color:var(--gray-600);font-size:12px;margin-top:3px}
.card-h .actions{display:flex;gap:6px;flex-wrap:wrap}

/* KPI */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--paper);border:1px solid var(--gray-200);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold)}
.kpi.g::before{background:var(--green-mid)}.kpi.r::before{background:var(--red)}.kpi.a::before{background:var(--amber)}.kpi.b::before{background:var(--blue)}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.7px;color:var(--gray-600);text-transform:uppercase}
.kpi .v{font-size:22px;font-weight:700;color:var(--navy);margin:6px 0 2px;font-variant-numeric:tabular-nums;font-family:var(--font-serif)}
.kpi .s{font-size:11px;color:var(--gray-600)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--gray-300);background:var(--paper);color:var(--navy);font-weight:600;font-size:12.5px;transition:all .12s}
.btn:hover{border-color:var(--navy-light);transform:translateY(-1px)}
.btn.p{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.btn.gold{background:var(--gold);color:var(--paper);border-color:var(--gold)}
.btn.green{background:var(--green);color:var(--paper);border-color:var(--green)}
.btn.red{background:var(--paper);color:var(--red);border-color:var(--red-border)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn.xs{padding:3px 8px;font-size:11px}
.btn.block{width:100%;justify-content:center}

/* FORM */
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.fgrid .full{grid-column:1/-1}
.fld label{display:block;font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--gray-600);text-transform:uppercase;margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--gray-300);border-radius:8px;font-size:13px;background:var(--paper)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,146,42,.16)}
.seg{display:flex;gap:0;border:1px solid var(--gray-300);border-radius:8px;overflow:hidden}
.seg button{flex:1;padding:9px;font-size:12.5px;font-weight:700;background:var(--paper);color:var(--gray-600)}
.seg button.on.inc{background:var(--green-pale);color:var(--green);box-shadow:inset 0 -3px 0 var(--green)}
.seg button.on.exp{background:var(--red-pale);color:var(--red);box-shadow:inset 0 -3px 0 var(--red)}

/* TABLE */
.twrap{overflow:auto;border:1px solid var(--gray-200);border-radius:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--navy);color:var(--paper);text-align:left;padding:9px 10px;font-weight:600;font-size:11.5px;white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--gray-200);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--cream)}
.num{text-align:right;font-variant-numeric:tabular-nums}
/* STICKY IDENTITY COLUMN — keep the first (identity) column pinned while wide
   ledgers scroll horizontally inside .twrap. Pure CSS, no JS/markup rewiring. */
.twrap th:first-child,.twrap td:first-child{position:sticky;left:0;z-index:1}
.twrap td:first-child{background:var(--paper)}
.twrap tbody tr:hover td:first-child{background:var(--cream)}
.twrap th:first-child{z-index:3;background:var(--navy)}

/* BADGES */
.bdg{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;border:1px solid transparent}
.bdg.inc{color:var(--green);background:var(--green-pale);border-color:var(--green-mid)}
.bdg.exp{color:var(--red);background:var(--red-pale);border-color:var(--red-border)}
.bdg.cash{color:var(--gold);background:var(--gold-pale);border-color:var(--gold-light)}
.bdg.bank{color:var(--blue);background:var(--blue-pale);border-color:var(--blue-border)}
.bdg.upi{color:var(--purple);background:var(--purple-pale);border-color:var(--purple-border)}
.bdg.card{color:var(--gray-600);background:var(--gray-100);border-color:var(--gray-300)}
.bdg.auto{color:var(--blue);background:var(--blue-pale);border-color:var(--blue-border)}
.bdg.locked{color:var(--paper);background:var(--navy)}
.bdg.void{color:var(--gray-600);background:var(--gray-100);border-color:var(--gray-300);text-decoration:line-through}
.bdg.ok{color:var(--green);background:var(--green-pale);border-color:var(--green-mid)}
.bdg.warn{color:var(--amber);background:var(--amber-pale);border-color:var(--amber-border)}
.bdg.src{color:var(--purple);background:var(--purple-pale);border-color:var(--purple-border)}

/* STATEMENT */
.st-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.st-box{border:1px solid var(--gray-200);border-radius:8px;overflow:hidden}
.st-box .st-th{background:var(--navy-mid);color:var(--paper);padding:8px 12px;font-size:12px;font-weight:700;letter-spacing:.4px}
.st-row{display:flex;justify-content:space-between;padding:7px 12px;border-bottom:1px solid var(--gray-200);font-size:12.5px}
.st-row:last-child{border-bottom:0}
.st-row.tot{background:var(--cream);font-weight:700;color:var(--navy)}
.st-row .d{color:var(--gray-600)}
.deno{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.deno-row{display:grid;grid-template-columns:60px 1fr 90px;gap:6px;align-items:center;font-size:12px}
.deno-row input{min-height:44px;padding:8px 11px;border:1px solid var(--gray-300);border-radius:8px;text-align:right;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;background:var(--paper)}
.deno-row input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,146,42,.16)}
.recon{padding:14px;border-radius:8px;text-align:center;font-weight:700;margin-top:12px}
.recon.ok{background:var(--green-pale);color:var(--green);border:1px solid var(--green-mid)}
.recon.bad{background:var(--red-pale);color:var(--red);border:1px solid var(--red-border)}
.recon .big{font-size:24px;font-family:var(--font-serif);display:block;margin-top:4px;font-variant-numeric:tabular-nums}

/* BANNER */
.banner{padding:11px 14px;border-radius:8px;font-size:12.5px;font-weight:600;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.banner.warn{background:var(--amber-pale);color:var(--amber);border:1px solid var(--amber-border)}
.banner.info{background:var(--blue-pale);color:var(--blue);border:1px solid var(--blue-border)}
.banner.lock{background:var(--gray-100);color:var(--gray-800);border:1px solid var(--gray-300)}
.banner.ok{background:var(--green-pale);color:var(--green);border:1px solid var(--green-mid)}

/* EMPTY */
.empty{padding:26px;text-align:center;color:var(--gray-600);font-size:12.5px;border:1px dashed var(--gray-300);border-radius:8px;background:var(--cream)}

/* MODAL */
.mbk{position:fixed;inset:0;background:rgba(13,35,64,.5);display:flex;align-items:center;justify-content:center;z-index:90;padding:16px}
.modal{background:var(--paper);border-radius:12px;max-width:440px;width:100%;max-height:90vh;overflow:auto;box-shadow:var(--shadow-lg)}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--gray-200);display:flex;justify-content:space-between;align-items:center}
.modal-h h3{font-size:17px}
.modal-b{padding:18px}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--paper);padding:11px 18px;border-radius:9px;font-size:13px;font-weight:600;z-index:120;box-shadow:var(--shadow-lg);border-left:4px solid var(--gold);max-width:90vw}
.toast.ok{border-left-color:var(--green-mid)}.toast.err{border-left-color:var(--red)}.toast.warn{border-left-color:var(--amber)}

/* MISC */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--gray-600)}
.small{font-size:11px}
#todayBadge{color:rgba(255,255,255,.75)}
.gauge{height:7px;border-radius:999px;background:var(--gray-200);overflow:hidden;margin-top:6px}
.gauge .f{height:100%;background:linear-gradient(90deg,var(--green-mid),var(--gold))}
.gauge .f.over{background:linear-gradient(90deg,var(--amber),var(--red))}
.flist{display:flex;flex-direction:column;gap:7px}
.fitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 11px;border:1px solid var(--gray-200);border-radius:8px}
.fitem .ic{width:30px;height:30px;border-radius:7px;background:var(--gold-pale);color:var(--gold);display:grid;place-items:center;font-size:14px}
@media(max-width:760px){
  .kgrid{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:1fr}
  .st-grid{grid-template-columns:1fr}
  .deno{grid-template-columns:1fr}
  .wrap{padding:14px 10px 50px}
}
/* ────── MOBILE / COMPACT RESPONSIVE LAYER (≤899px) ──────
   Additive only. Wide-screen layout above is unchanged.
   Goals: no horizontal overflow, wide tables scroll inside their
   .twrap wrapper, grids collapse to 1 column (KPI tiles stay 2),
   form controls ≥16px (no iOS focus-zoom), tap targets ≥44px. */
@media(max-width:899px){
  html,body{max-width:100%;overflow-x:hidden}

  /* Keep every destination visible without a sideways tab gesture. */
  .tabs{flex-wrap:wrap;overflow-x:hidden;padding:4px 8px}
  .tab{flex:1 1 auto;text-align:center;padding:10px 12px}

  /* keep multi-column form/statement grids single-column */
  .fgrid,.st-grid,.deno{grid-template-columns:1fr}
  /* small KPI tiles stay 2-up; allow shrink so they never overflow */
  .kgrid{grid-template-columns:repeat(2,1fr);gap:10px}
  .kpi,.card,.st-box,.fld,.kgrid>*{min-width:0}
  .kpi .v{font-size:19px}

  /* let long content in flex/grid children shrink instead of pushing width */
  .card-h,.row,.fitem{min-width:0}
  .card-h h3,.card-h p,.row>*{min-width:0}
  .wrap{padding:12px 10px 48px}
  .card{padding:14px}

  /* HEADER — wrap cleanly, let the role selector drop to its own line */
  .hdr{padding:12px 14px;gap:10px}
  .hdr-right{margin-left:0;width:100%}
  .role-sel{flex:1}
  .role-sel select{flex:1;min-width:0}

  /* tables: scroll horizontally inside the existing .twrap wrapper
     (do NOT squash). momentum scroll on iOS. The identity (first) column
     stays pinned via the sticky rule above, so give the 9-col ledger room. */
  .twrap{-webkit-overflow-scrolling:touch}
  .twrap table{min-width:760px}

  /* FORM CONTROLS — ≥16px stops focus-zoom; ≥44px tall is tap-friendly.
     Covers both .fld controls and the inline-styled inputs used in
     statement/close/vendor/budget headers. */
  /* ≥16px stops focus-zoom and ≥44px is tap-friendly — applied to ALL controls
     (including the inline-styled date/month/vendor/budget inputs, not just .fld). */
  input,select,textarea{font-size:16px;min-height:44px}
  .fld input,.fld select,.fld textarea{font-size:16px;min-height:44px}
  .seg button{min-height:44px}
  /* denomination inputs are cash-counting fields: keep them tall, right-aligned
     with large numerals so notes are easy to tally on a phone. */
  .deno-row input{min-height:44px;font-size:16px;text-align:right}

  /* BUTTONS — every actionable control meets the 44px tap floor, including the
     in-row table buttons (their rows scroll horizontally). */
  .btn{min-height:44px}
  .btn.sm{min-height:44px}
  .btn.xs{min-height:44px}
  /* a button used as a tab-like full-width action should stretch */
  .btn.block{min-height:46px}

  /* dashboard "cash position" inline 3-up row → wrap & breathe */
  .row[style*="gap:20px"]{gap:14px!important}

  /* modal/toast already fluid; just make sure they fit small widths */
  .modal{max-width:100%}
  .toast{left:10px;right:10px;transform:none;max-width:none;text-align:center}

  /* ─────── LIST/RECORD TABLES → CARDS (compact ≤899px) ───────

<script>
/* ═══════════════════════════════════════════════════════════════════════
   EXPENSE MANAGER v2 — CENTRAL FINANCIAL LEDGER
   Saagar Traders / Gold Mart Group
   - gm_expenses is the single master ledger (income + expense)
   - tanishq_statements holds per-day reconciliation + lock state
   - Daily Cash Statement is AUTO-GENERATED from the ledger (locked rows)
   - Cross-module feeds: WSC / Payroll / Stock / QMS  →  Tax monthly feed
   Backward compatible: migrates existing gm_expenses & tanishq_statements.
   ═══════════════════════════════════════════════════════════════════════ */

/* ---------- storage ---------- */
var K = {
  exp:'gm_expenses', stmt:'tanishq_statements', role:'gm_role',
  vend:'gm_vendors', budg:'gm_budgets', audit:'gm_audit',
  set:'gm_settings', tax:'gm_tax_feed', petty:'gm_petty',
  udhaar:'saagar_udhaar_ledger_v1',   /* Wave 3: standalone receivables register (isolated from cash/income) */
  rec:'gm_recurring',                 /* P1-16: recurring expense templates (config, not money) */
  gstRates:'gm_gst_rates'             /* P1-17: per-category income GST rates {category:pct}; gm_ prefix = shell-backup covered */
};
function L(k,fb){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }
function S(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ toast('Storage error: '+e.message,'err'); } }

/* R0-W1 SEC-04 (Slice B): resolve the shell's step-up re-auth across the srcdoc boundary.
   FAIL-OPEN ON SKEW: an older shell without the helper => TRUE => the action proceeds as today. */
const stReauth=SaagarModuleRuntime.reauth;

/* ---------- constants ---------- */
var EXP_CATS=['Inventory','Rent','Salary','Utilities','Marketing','Bank Charges','Transport','Repairs','Statutory','Miscellaneous'];
var INC_CATS=['Retail Sale','Service Income','Other Income'];
var MODES=['Cash','Bank','UPI','Card'];
var DENOMS=[2000,500,200,100,50,20,10,5,2,1];
var REASONS=['Cash shortage correction','Duplicate entry','Missed receipt','Wrong payment mode','Voucher correction','Other'];

/* ---------- util ---------- */
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
function p2(n){ return (n<10?'0':'')+n; }
function ym(s){ return (s||todayStr()).slice(0,7); }
function uid(pfx){ return (pfx||'e')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7); }
function nINR(n){ if(n==null||isNaN(n))return '₹0'; return '₹'+Math.round(n).toLocaleString('en-IN'); }
function num(v){ var n=parseFloat(v); return isNaN(n)?0:n; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function badgeToken(s){ var v=String(s==null?'':s).toLowerCase(); return /^(cash|bank|upi|card|auto)$/.test(v)?v:'auto'; }
/* JavaScript-source encoder for a value placed inside a single-quoted inline
   handler argument. This is deliberately separate from HTML text escaping. */
function jsq(s){ if(s!=null&&typeof s!=='string'&&typeof s!=='number'&&typeof s!=='boolean')throw new TypeError('inline argument must be primitive'); var v=String(s==null?'':s); if(v.length>512)throw new RangeError('inline argument too long'); return v.replace(/[\\'"&<>\u0000-\u001f\u007f\u2028\u2029]/g,function(c){var n=c.charCodeAt(0),h=n.toString(16);while(h.length<(n<=255?2:4))h='0'+h;return n<=255?'\\x'+h:'\\u'+h;}); }
function jargs(v){ if(v!=null&&typeof v!=='string'&&typeof v!=='number'&&typeof v!=='boolean')throw new TypeError('delegated argument must be primitive'); if(typeof v==='string'&&v.length>512)throw new RangeError('delegated argument too long'); return encodeURIComponent(JSON.stringify([v])); }
/* P1-17: soft format check — Indian GSTIN is 15 chars (2-digit state + 13 alnum). NEVER blocks. */
function gstinLooksOk(g){ return !g || /^[0-9]{2}[A-Z0-9]{13}$/.test(g); }
function prevDay(s){ var d=new Date(s+'T00:00:00'); d.setDate(d.getDate()-1); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
/* ---------- on-screen PRINT-PREVIEW bridge (shell shows the doc with Print / Save-PDF / Share) ---------- */
function stEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function stPrintDoc(o){return SaagarModuleRuntime.printDocument(o,function(){toast('Controlled print is available only inside Saagar Control Centre.','err');});}
/* ---------- view-date rail (shell-provided window.__stAsOf) ----------
   asOf() = the day the user wants to VIEW. Defaults to __stAsOf (a valid
   "YYYY-MM-DD"), else falls back to the module's own today. isPast() is true
   only when the viewed day is strictly EARLIER than the real today → VIEW-ONLY
   history mode (no create / edit / save / submit / delete / lock). When asOf
   equals today (or __stAsOf is empty/invalid) the module behaves exactly as before. */
function validDate(s){ return typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function asOf(){ try{ var v=window.__stAsOf; return validDate(v)?v:todayStr(); }catch(e){ return todayStr(); } }
function isPast(){ return asOf()<todayStr(); }
function toast(m,k){ var t=document.getElementById('toast'); t.textContent=m; t.className='toast '+(k||''); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.add('hide');},2600); }
/* Per-row WhatsApp/share: read-only summary of ONE entry, sent via the shell's
   existing share infra (SaagarModuleBridge.shareText / SaagarModuleBridge.share) with offline-safe
   fallbacks. Never mutates data; every cross-frame call is typeof-guarded. */
function shareEntry(id){
  var e=getLedger().find(function(x){return x.id===id;}); if(!e) return;
  var lines=[
    (e.type==='income'?'Income':'Expense')+' · '+e.date,
    'Category: '+(e.category||'—'),
    'Amount: '+nINR(e.amount),
    'Mode: '+(e.mode||'—')
  ];
  if(e.vendor) lines.push('Vendor: '+e.vendor);
  if(e.description) lines.push('Note: '+e.description);
  if(e.void) lines.push('(VOID'+(e.voidReason?' — '+e.voidReason:'')+')');
  var summary=lines.join('\n');
  try{
    if(typeof parent!=='undefined' && parent && parent!==window && typeof SaagarModuleBridge.shareText==='function'){ SaagarModuleBridge.shareText(summary,'expense'); return; }
  }catch(err){}
  toast('Controlled sharing is available only inside Saagar Control Centre.','warn');
}
function role(){ return localStorage.getItem(K.role)||'cashier'; }
function setRole(r){ localStorage.setItem(K.role,r); render(); toast('Role: '+r,'ok'); }
/* Shared Super-Admin flag set by the shell (same key/pattern as the service module). */
var adminModeKey='st_v2_admin_mode';
function isSuperAdmin(){ try{ return !!(SaagarModuleBridge.ownerSession&&SaagarModuleBridge.ownerSession.isOwnerActive()); }catch(e){ return false; } }
function can(act){
  var r=role();
  if(act==='entry') return true;
  if(act==='void') return r==='cashier'||r==='accounts'||r==='owner';
  if(act==='close') return r==='cashier'||r==='owner';
  if(act==='approve') return r==='accounts'||r==='owner';
  if(act==='reopen') return r==='owner';
  if(act==='monthlock') return r==='owner';
  if(act==='recurring') return r==='accounts'||r==='owner';   // P1-16: template CRUD; posting is open to all roles
  if(act==='monthoverride') return r==='owner';               // P1-18/P1-17: locked-month override + GST-rate editing (single verb per Wave-10 decision #1)
  return false;
}

/* ---------- audit ---------- */
function audit(action,detail){
  var a=L(K.audit,[]); if(!Array.isArray(a)) a=[];   // a corrupted (non-array) store must never brick the calling money action
  a.unshift({id:uid('a'),at:new Date().toISOString(),by:role(),action:action,detail:detail||''});
  if(a.length>800) a=a.slice(0,800);
  S(K.audit,a);
}

/* ---------- migration / normalization ---------- */
function normEntry(e){
  e=e||{};
  var mode=e.mode||e.paymentMode||'Cash';
  if(MODES.indexOf(mode)<0) mode=(/cash/i.test(mode)?'Cash':/upi/i.test(mode)?'UPI':/card/i.test(mode)?'Card':'Bank');
  var type=(e.type||'expense').toLowerCase()==='income'?'income':'expense';
  var src=e.source||(e.sourceStatementId?'statement':null);
  var gstA=num(e.gstAmount), gstR=num(e.gstRatePct);   /* P1-17: optional GST breakup — >0 carries, else undefined so legacy rows serialize byte-identical (store/status precedent) */
  return {
    id:e.id||uid('e'),
    type:type,
    date:(e.date||todayStr()).slice(0,10),
    amount:num(e.amount),
    category:e.category||(type==='income'?'Other Income':'Miscellaneous'),
    mode:mode,
    vendor:e.vendor||'',
    firm:e.firm||'',
    // Wave-5: OPTIONAL per-store cash-drawer tag. Whitelisted to the two canonical
    // branch codes; anything else (incl. legacy/undefined) → undefined = Unassigned.
    store:(e.store==='WLMHW'||e.store==='HEMW')?e.store:undefined,
    gstAmount:gstA>0?gstA:undefined,
    gstRatePct:gstR>0?gstR:undefined,
    description:e.description||e.desc||e.d||'',
    notes:e.notes||'',
    billPhoto:e.billPhoto||null,
    source:src,                                  // null|wsc|payroll|stock|qms|statement|petty
    sourceRef:e.sourceRef||e.sourceStatementId||null,
    void:!!e.void, voidReason:e.voidReason||null,
    // #19: ADDITIVE approval status. Only "pending"/"approved" are carried; a missing
    // status (legacy entry) stays undefined → editable, never coerced to "approved".
    status:(e.status==='pending'||e.status==='approved')?e.status:undefined,
    approvedBy:e.approvedBy||null, approvedAt:e.approvedAt||null,
    createdAt:e.createdAt||new Date().toISOString(),
    createdBy:e.createdBy||'legacy',
    editLog:Array.isArray(e.editLog)?e.editLog:[]
  };
}
function getLedger(){ return L(K.exp,[]).map(normEntry); }
function saveLedger(a){ S(K.exp,a.map(normEntry)); }

function migrateOnce(){
  if(L(K.set,{}).migratedV2) return;
  var raw=L(K.exp,[]);
  if(raw.length) saveLedger(raw.map(normEntry));
  var st=L(K.stmt,{}), changed=false;
  Object.keys(st).forEach(function(key){
    var s=st[key];
    if(s && s.date && key!==s.date){ st[s.date]=migrateStmt(s); changed=true; }
    else if(s && s.date){ st[key]=migrateStmt(s); }
  });
  if(changed||Object.keys(st).length) S(K.stmt,st);
  var set=L(K.set,{}); set.migratedV2=true; set.gstRate=set.gstRate||0; S(K.set,set);
  audit('system.migrate','Migrated to v2 central ledger model');
}
function migrateStmt(s){
  return {
    date:s.date,
    openingBalance:num(s.openingBalance),
    physDeno:s.physDeno||{}, bankDeno:s.bankDeno||{},
    closed:!!s.closed, closedAt:s.closedAt||null, closedBy:s.closedBy||null,
    approved:!!s.approved, approvedBy:s.approvedBy||null, approvedAt:s.approvedAt||null,
    reopenReason:s.reopenReason||null, mismatchReason:s.mismatchReason||null,
    // Wave-5: OPTIONAL per-store reconciliation overlay { WLMHW:{…}, HEMW:{…} }.
    // Carried as-is if a plain object; old records have none → undefined.
    byStore:(s.byStore&&typeof s.byStore==='object')?s.byStore:undefined,
    monthLocked:!!s.monthLocked
  };
}
function getStmt(date){
  var st=L(K.stmt,{});
  return st[date]||{date:date,openingBalance:null,physDeno:{},bankDeno:{},closed:false,closedAt:null,closedBy:null,approved:false,approvedBy:null,approvedAt:null,reopenReason:null,mismatchReason:null,byStore:undefined,monthLocked:false};
}
function saveStmt(s){ var st=L(K.stmt,{}); st[s.date]=s; S(K.stmt,st); }

/* ── P1-18: month lock (tax feed) ─────────────────────────────────────────
   genTaxFeed() stamps monthLocked=true only on statement DAYS that EXIST when
   the feed is generated; statement days are created lazily (saveStmt only runs
   on deno/close/approve/reopen activity), so days of a fed month with no
   statement record — and days created later — carry NO stamp. The lock is
   therefore derived at MONTH level: a month is locked when its tax feed exists
   (gm_tax_feed[m] is ALWAYS written by genTaxFeed) OR any of its statement
   days carries the stamp (covers a gm_tax_feed blob lost to corruption —
   L() parse failure returns the fallback {}). */
function isMonthLocked(dateStr){
  try{
    var m=ym(dateStr);
    if(L(K.tax,{})[m]) return true;
    var st=L(K.stmt,{});
    var ks=Object.keys(st);
    for(var i=0;i<ks.length;i++){ if(ks[i].slice(0,7)===m && st[ks[i]] && st[ks[i]].monthLocked===true) return true; }
    return false;
  }catch(e){ return false; }   // fail OPEN: a storage hiccup must never brick daily entry; day-close + audit remain as controls
}
/* ONLY writer of gm_tax_feed[m].stale/.staleAt. genTaxFeed's wholesale month-object
   replace (which omits both keys) is the auto-clear — no clearing code anywhere. */
function markFeedStale(m){
  var feed=L(K.tax,{});
  if(!feed||typeof feed!=='object'||Array.isArray(feed)) return;   // corrupt feed blob: bail, never throw
  if(!feed[m]||typeof feed[m]!=='object') return;   // nothing was handed to the CA for this month → nothing can be stale
  feed[m].stale=true; feed[m].staleAt=new Date().toISOString();
  S(K.tax,feed);
}

/* ---------- cash statement computation (the core fix) ---------- */
function denoTotal(d){ return DENOMS.reduce(function(t,v){ return t+(num(d&&d[v])*v); },0); }

function computeDay(date){
  // All non-void ledger entries for the date
  var rows=getLedger().filter(function(e){ return e.date===date && !e.void; });
  var cashIn=0,cashOut=0, bankIn=0,bankOut=0, incTot=0,expTot=0;
  rows.forEach(function(e){
    var isCash=e.mode==='Cash';
    if(e.type==='income'){ incTot+=e.amount; if(isCash) cashIn+=e.amount; else bankIn+=e.amount; }
    else { expTot+=e.amount; if(isCash) cashOut+=e.amount; else bankOut+=e.amount; }
  });
  // Opening = carry-forward from previous day's counted closing
  // audit fix: walk back to the most recent CLOSED day so cash-in-hand carries across gaps
  // (Sundays/holidays with no closed statement) instead of resetting to 0.
  var prev=prevDay(date), opening, prevClosed=false, __wd=prev;
  for(var __i=0; __i<90 && !prevClosed; __i++){ var __s=getStmt(__wd); if(__s && __s.closed){ opening=Math.max(denoTotal(__s.physDeno)-denoTotal(__s.bankDeno),0); prevClosed=true; } else { __wd=prevDay(__wd); } }
  if(!prevClosed){ var sNow=getStmt(date); opening=(sNow.openingBalance!=null)?sNow.openingBalance:0; }
  var expectedClosing = opening + cashIn - cashOut;
  return {date:date,rows:rows,opening:opening,cashIn:cashIn,cashOut:cashOut,
          bankIn:bankIn,bankOut:bankOut,incTot:incTot,expTot:expTot,
          net:incTot-expTot,expectedClosing:expectedClosing,prevClosed:prevClosed};
}

/* ---------- Wave-5: per-store cash drawer ---------- */
/* Canonical stores = saagar_org_master_v1.branches[].code (firm SAT), fallback the
   hardcoded pair. ORTHOGONAL to firm (legal entity). */
function orgStores(){
  try{ var o=JSON.parse(localStorage.getItem('saagar_org_master_v1')||'null');
    if(o&&Array.isArray(o.branches)){
      var a=o.branches.filter(function(b){return b&&b.active!==false&&b.code&&b.name;}).map(function(b){return {code:b.code,name:b.name};});
      if(a.length) return a;
    }

}

function storeOpts(sel){ return '<option value="">— Unassigned —</option>'+orgStores().map(function(s){return '<option value="'+esc(s.code)+'"'+(s.code===sel?' selected':'')+'>'+esc(s.name)+'</option>';}).join(''); }
/* per-day per-store compute (additive sibling; computeDay is untouched).
   store==null → whole business (same set as computeDay). store!=null → only rows
   tagged that store; untagged/legacy rows never appear in a store view. */
function computeDayStore(date,store){
  var rows=getLedger().filter(function(e){ return e.date===date && !e.void && (store==null || e.store===store); });
  var cashIn=0,cashOut=0,bankIn=0,bankOut=0,incTot=0,expTot=0;
  rows.forEach(function(e){
    var isCash=e.mode==='Cash';
    if(e.type==='income'){ incTot+=e.amount; if(isCash) cashIn+=e.amount; else bankIn+=e.amount; }
    else { expTot+=e.amount; if(isCash) cashOut+=e.amount; else bankOut+=e.amount; }
  });
  // per-store carry-forward: walk back to previous day whose byStore[store] is closed
  var opening, prevClosed=false, __wd=prevDay(date);
  for(var __i=0; __i<90 && !prevClosed; __i++){
    var __s=getStmt(__wd), __sub=(__s.byStore&&__s.byStore[store]);
    if(__sub&&__sub.closed){ opening=Math.max(denoTotal(__sub.physDeno)-denoTotal(__sub.bankDeno),0); prevClosed=true; }
    else { __wd=prevDay(__wd); }
  }
  if(!prevClosed){ var __sub0=(getStmt(date).byStore||{})[store]; opening=(__sub0&&__sub0.openingBalance!=null)?__sub0.openingBalance:0; }
  var expectedClosing=opening+cashIn-cashOut;
  return {date:date,store:store,rows:rows,opening:opening,cashIn:cashIn,cashOut:cashOut,
          bankIn:bankIn,bankOut:bankOut,incTot:incTot,expTot:expTot,
          net:incTot-expTot,expectedClosing:expectedClosing,prevClosed:prevClosed};
}

function readEditPhoto(inputId,cb){
  var f=document.getElementById(inputId); if(!f||!f.files||!f.files[0]){ cb(null); return; }
  var img=f.files[0]; if(img.size>4*1024*1024){ toast('Photo too large (max 4MB)','warn'); cb(null); return; }
  var r=new FileReader();
  r.onload=function(){
    var i=new Image();
    i.onload=function(){
      var sc=Math.min(1,1000/i.width), c=document.createElement('canvas');
      c.width=i.width*sc; c.height=i.height*sc;
      c.getContext('2d').drawImage(i,0,0,c.width,c.height);
      cb(c.toDataURL('image/jpeg',0.7));
    };
    i.onerror=function(){ cb(null); };
    i.src=r.result;
  };
  r.onerror=function(){ cb(null); };
  r.readAsDataURL(img);
}
// Wave-4: view a row's bill photo. Resolves '@photo:<pid>' refs via SaagarPhoto (device-only),
// or passes a legacy inline base64 data URL straight through. Injects via img.src (no HTML concat).
function viewPhoto(id){
  var e=getLedger().find(function(x){return x.id===id;}); if(!e) return;
  var bp=e.billPhoto; if(!bp) return;
  var __resolve=function(b,cb){
    if(!b){ cb(null); return; }
    if(b.indexOf('@photo:')===0){
      var pid=b.slice(7);
      if(SaagarModuleBridge.photo&&SaagarModuleBridge.photo.get){ SaagarModuleBridge.photo.get(pid).then(function(u){cb(u||null);},function(){cb(null);}); }
      else { cb(null); }
    } else { cb(b); }
  };
  modal('Bill photo','<div id="bpImg" class="muted small" style="text-align:center;padding:12px">Loading…</div>',function(){return true;});
  __resolve(bp,function(u){
    var c=document.getElementById('bpImg'); if(!c) return;   // modal may have been closed
    if(u){ c.innerHTML=''; c.style.padding='0'; var im=new Image(); im.src=u; im.style.maxWidth='100%'; im.style.borderRadius='8px'; c.appendChild(im); }
    else { c.innerHTML='Photo unavailable (not synced to this device)'; }
  });
}
function addEntry(){
  var type=window.__et||'expense';
  var date=val('f_date'), amt=num(val('f_amt')), cat=val('f_cat'), mode=val('f_mode'),
      vendor=val('f_vendor').trim(), firm=val('f_firm'), store=val('f_store'), desc=val('f_desc').trim(), notes=val('f_notes').trim();
  var gstAmt=(type==='expense')?num(val('f_gstamt')):0, gstRPct=(type==='expense')?num(val('f_gstr')):0;   /* P1-17: expense-only GST reads (val() returns '' for absent ids) */
  if(amt<=0){ toast('Enter an amount greater than 0','err'); return; }
  if(!desc){ toast('Description is required','err'); return; }
  if(isPast()){ toast('Historical view is read-only. Switch to today to add entries.','err'); return; }
  if(getStmt(date).closed){ toast('That day’s cash statement is locked. Owner must reopen it first.','err'); return; }
  /* P1-18: month-lock gate — the month's tax feed was already generated */
  var __m=ym(date), __mLock=isMonthLocked(date);
  if(__mLock && !can('monthoverride')){ toast('Month '+__m+' is tax-locked — its tax feed was already generated. Owner override required.','err'); return; }
  var led=getLedger();
  var dup=led.find(function(e){ return !e.void && e.date===date && Math.abs(e.amount-amt)<0.01 && e.description.toLowerCase()===desc.toLowerCase(); });
  if(dup && !confirm('A similar entry already exists for '+date+' ('+nINR(amt)+' — '+desc+'). Save anyway?')) return;
  if(gstAmt>amt && !confirm('GST amount ('+nINR(gstAmt)+') is more than the entry amount ('+nINR(amt)+'). Save anyway?')) return;   /* P1-17: warn, don't block */
  var __doSave=function(__ovRsn){                                    // P1-18 continuation: __ovRsn=null on the normal path, owner's reason on override
  readPhoto(function(photo){
    var __eid=uid('e'); var __save=function(__bp){ var e=normEntry({id:__eid,type:type,date:date,amount:amt,category:cat,mode:mode,vendor:vendor,firm:firm,store:store,description:desc,notes:notes,gstAmount:gstAmt,gstRatePct:gstRPct,billPhoto:__bp,source:null,status:'pending',createdBy:role()});
    var __fresh=getLedger(); __fresh.push(e); saveLedger(__fresh);   // P1-18: fresh re-read — the override modal adds a human-scale wait (exp-bug-01 pattern); `led` above stays dup-check-only
    if(vendor){ var vs=L(K.vend,[]); if(!vs.find(function(v){return v.name.toLowerCase()===vendor.toLowerCase();})){ vs.push({name:vendor}); S(K.vend,vs); } }
    audit('ledger.create',type+' '+nINR(amt)+' · '+cat+' · '+date+' · '+desc);
    if(__ovRsn){ audit('locked-month-override','add '+__eid+' · '+date+' · '+nINR(amt)+' · '+__ovRsn); markFeedStale(__m); }   // P1-18
    toast('Saved — also reflected in '+date+' cash statement','ok');
    if(type==='expense') budgetAlertToast(cat,date);   /* P1-19: chained budget alert */
    renderLedger(); }; if(photo && SaagarModuleBridge.photo && SaagarModuleBridge.photo.enabled){ var __pid=SaagarModuleBridge.photo.refId('expense',__eid,'billPhoto'); SaagarModuleBridge.photo.put(__pid,photo).then(function(ok){ __save(ok?('@photo:'+__pid):photo); }, function(){ __save(photo); }); } else { __save(photo); }
  });
  };
  if(!__mLock){ __doSave(null); return; }
  lockedMonthOverrideModal(__m,'entry',__doSave);
}
function editEntry(id){

  /* P1-18: month-lock gate. The edit modal has no date field, so __m is stable through
     the async photo path; if a future wave adds date editing, the gate must check BOTH
     old and new months. m_rsn doubles as the override reason — no second field. */
  var __m=ym(e.date), __mLock=isMonthLocked(e.date);
  if(__mLock && !can('monthoverride')){ toast('Month '+__m+' is tax-locked — its tax feed was already generated. Only Owner can edit this entry.','err'); return; }

    fld('Amount','<input id="m_amt" type="number" value="'+e.amount+'">')+
    fld('Category','<select id="m_cat">'+(e.type==='income'?INC_CATS:EXP_CATS).map(function(c){return '<option'+(c===e.category?' selected':'')+'>'+c+'</option>';}).join('')+'</select>')+

    (e.type==='expense'?
      fld('GST rate (%)','<input id="m_gstr" type="number" min="0" step="0.01" value="'+(e.gstRatePct||'')+'">')+
      fld('GST on bill (₹)','<input id="m_gstamt" type="number" min="0" step="0.01" value="'+(e.gstAmount||'')+'">')
    :'')+
    fld('Description','<input id="m_desc" value="'+esc(e.description)+'">')+
    fld('Bill photo',(e.billPhoto?'<div class="small muted" style="margin-bottom:6px">A photo is already attached — choosing a new file replaces it.</div>':'')+'<input type="file" id="m_photo" accept="image/*" capture="environment">')+
    fld('Reason for change','<input id="m_rsn" placeholder="required">','full'),
    async function(){

      var na=num(val('m_amt')); if(!(na>0)||!isFinite(na)){ toast('Enter an amount greater than 0','err'); return false; }

      var ngA=(e.type==='expense')?num(val('m_gstamt')):0, ngR=(e.type==='expense')?num(val('m_gstr')):0;
      if(ngA>na && !confirm('GST amount ('+nINR(ngA)+') is more than the entry amount ('+nINR(na)+'). Save anyway?')) return false;
      /* R0-W1 SEC-04: locked-month override only — do not remove the __mLock guard. */
      if((__mLock||isMonthLocked(e.date)) && !await stReauth('Edit an entry in the tax-locked month'))return false;
      /* Audit fix exp-bug-01: re-read the ledger FRESH inside the confirm callback and mutate the
         entry by id in that fresh array, so a bridge tick that appended income while the modal was
         open is preserved (avoids whole-blob last-write-wins clobber). Fall back to the captured
         entry only if the row is gone from the fresh array. */
      var fresh=getLedger(), fe=fresh.find(function(x){return x.id===id;});
      if(!fe){ fresh=led; fe=e; }
      // Wave-4: a bill photo may be (re)attached on edit. Record only a '(changed)' marker in the
      // editLog (never dump base64), and persist the bytes via SaagarPhoto async AFTER the modal closes.
      var __hasFile=(function(){var f=document.getElementById('m_photo');return !!(f&&f.files&&f.files[0]);})();
      // Wave-5: whitelisted store tag (anything else → undefined = Unassigned).
      var __store=(function(){var s=val('m_store');return (s==='WLMHW'||s==='HEMW')?s:undefined;})();
      var old={amount:fe.amount,category:fe.category,mode:fe.mode,store:fe.store||'Unassigned',description:fe.description};
      var __new={amount:na,category:val('m_cat'),mode:val('m_mode'),store:__store||'Unassigned',description:val('m_desc').trim()};
      if(__hasFile){ old.billPhoto=fe.billPhoto?'(present)':'(none)'; __new.billPhoto='(changed)'; }
      /* P1-17: expense rows only, so income-row editLogs are unchanged. */
      if(e.type==='expense'){ old.gstAmount=fe.gstAmount||0; old.gstRatePct=fe.gstRatePct||0;
                              __new.gstAmount=ngA||0; __new.gstRatePct=ngR||0; }
      fe.amount=na; fe.category=val('m_cat'); fe.mode=val('m_mode'); fe.store=__store; fe.description=val('m_desc').trim(); fe.gstAmount=ngA>0?ngA:undefined; fe.gstRatePct=ngR>0?ngR:undefined;
      fe.editLog.push({at:new Date().toISOString(),by:role(),old:old,new:__new,reason:rsn});
      /* P1-18 TOCTOU: re-check the lock at COMMIT time — a feed generated while this modal was
         open must still get the override audit + stale flag (m_rsn already carries the reason). */
      var __lockNow=__mLock||isMonthLocked(fe.date);
      var __commit=function(){ saveLedger(fresh); audit('ledger.edit',fe.id+' · '+rsn); if(__lockNow){ audit('locked-month-override','edit '+fe.id+' · '+fe.date+' · '+rsn); markFeedStale(ym(fe.date)); } toast('Updated','ok'); if(fe.type==='expense') budgetAlertToast(fe.category,fe.date); renderLedger(); };
      if(!__hasFile){ __commit(); return true; }
      // Async photo path (mirrors addEntry): non-photo edits are ALWAYS committed, photo never lost —
      // only downgraded to inline base64 if SaagarPhoto is absent/fails.
      readEditPhoto('m_photo',function(photo){
        if(!photo){ __commit(); return; }   // oversize/decode fail already toasted by helper
        if(SaagarModuleBridge.photo && SaagarModuleBridge.photo.enabled){
          var pid=SaagarModuleBridge.photo.refId('expense',fe.id,'billPhoto');
          SaagarModuleBridge.photo.put(pid,photo).then(function(ok){ fe.billPhoto=ok?('@photo:'+pid):photo; __commit(); }, function(){ fe.billPhoto=photo; __commit(); });
        } else { fe.billPhoto=photo; __commit(); }
      });
      return true;   // let modal close now; persistence completes async and re-renders
    });
}
function voidEntry(id){
  if(isPast()){ toast('Historical view is read-only','err'); return; }
  if(!can('void')){ toast('Your role cannot void entries','err'); return; }
  var led=getLedger(), e=led.find(function(x){return x.id===id;}); if(!e) return;
  if(e.status==='approved'){ toast('Approved entry is locked','err'); return; }   // #19 lock
  if(getStmt(e.date).closed){ toast('Day locked — reopen first','err'); return; }
  /* P1-18: month-lock gate — voids in a fed month need the Owner override too (the stored
     stale flag is the only mechanism that can see voids; they stamp no row timestamp). */
  var __m=ym(e.date), __mLock=isMonthLocked(e.date);
  if(__mLock && !can('monthoverride')){ toast('Month '+__m+' is tax-locked — its tax feed was already generated. Only Owner can void this entry.','err'); return; }
  modal('Void entry',
    (__mLock?'<div class="banner warn" style="margin-bottom:10px">⚠ <div>Month '+__m+' is tax-locked. Confirming records an Owner override and marks the '+__m+' tax feed stale.</div></div>':'')+
    '<p class="small muted" style="margin-bottom:10px">'+esc(e.description)+' · '+nINR(e.amount)+'</p>'+
    fld('Reason','<select id="v_r">'+REASONS.map(function(r){return '<option>'+r+'</option>';}).join('')+'</select>')+
    fld('Note','<input id="v_n" placeholder="optional detail">','full'),
    async function(){
      /* P1-18: the canned select (v_r) is always non-empty — a locked-month override also
         demands the free-text note so the audit trail carries a specific reason.
         TOCTOU: re-check at commit time — a feed generated while the modal was open counts. */
      var __lockNow=__mLock||isMonthLocked(e.date);
      if(__lockNow){ var __vn=val('v_n').trim(); if(!__vn){ toast('Month is tax-locked — add a specific note for the override','err'); return false; } }
      /* R0-W1 SEC-04: locked-month override only — do not remove the __lockNow/__mLock guard. */
      if(__lockNow && !await stReauth('Void an entry in the tax-locked month'))return false;
      /* Audit fix exp-bug-01: re-read the ledger FRESH inside the confirm callback and void the
         entry by id in that fresh array, so a bridge tick that appended income while the modal was
         open is preserved (avoids whole-blob last-write-wins clobber). Fall back to the captured
         entry only if the row is gone from the fresh array. */
      var fresh=getLedger(), fe=fresh.find(function(x){return x.id===id;});
      if(!fe){ fresh=led; fe=e; }
      fe.void=true; fe.voidReason=val('v_r')+(val('v_n')?(' — '+val('v_n')):'');
      saveLedger(fresh); audit('ledger.void',fe.id+' · '+fe.voidReason);
      if(__lockNow){ audit('locked-month-override','void '+fe.id+' · '+fe.date+' · '+fe.voidReason); markFeedStale(ym(fe.date)); }   // P1-18 (lock re-checked at commit)
      toast('Entry voided (kept for audit)','ok'); renderLedger(); return true;
    });
}
/* #19: Super-Admin approves a PENDING entry → status "approved", which LOCKS it
   (edit/void denied above). Admin-only; only acts on pending entries. */
function approveEntry(id){
  if(!isSuperAdmin()){ toast('Super Admin only','err'); return; }
  var led=getLedger(), e=led.find(function(x){return x.id===id;}); if(!e) return;
  if(e.status!=='pending'){ toast('Only pending entries can be approved','warn'); return; }
  e.status='approved'; e.approvedBy=role(); e.approvedAt=new Date().toISOString();
  saveLedger(led); audit('ledger.approve',e.id+' · '+nINR(e.amount)+' · '+e.description);
  toast('Entry approved & locked','ok'); renderLedger();
}
function exportLedgerCSV(){

  getLedger().sort(function(a,b){return a.date.localeCompare(b.date);}).forEach(function(e){
    rows.push([e.date,e.firm||'Unassigned',e.type,e.category,e.mode,e.vendor,e.description,e.amount,e.source||'manual',e.void?'Y':'',e.voidReason||'',e.createdBy,e.store?storeName(e.store):'Unassigned',e.gstAmount||'',e.gstRatePct||'']);
  });

function dlCSV(fn,rows){
  var c=rows.map(function(r){return r.map(function(v){var s=String(v==null?'':v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}).join(',');}).join('\n');
  var b=new Blob([c],{type:'text/csv'});
  if(window.parent&&window.parent!==window){
    window.parent.postMessage({type:'ST_SHARE',file:b,fileName:fn,title:'Expense CSV',exportId:'expense-csv-export',scopeId:'expense-register',scopeLabel:'expense or audit register',rowCount:Math.max(0,rows.length-1),purposeId:'accounting-register'},SaagarModuleRuntime.targetOrigin);
    return;
  }
  toast('Controlled export is available only inside Saagar Control Centre.','err');
}

/* ═══════════════ P1-16: RECURRING EXPENSE TEMPLATES ═══════════════
   gm_recurring = [template]. Templates are CONFIG, not money: posting writes an
   ORDINARY ledger row (source:'recurring', sourceRef:'rec:<tplId>:<YYYY-MM>')
   through the SAME normEntry+saveLedger+audit path addEntry uses, so every
   existing reader (bridge P1-43, voucher check, PDFs, budgets, CSV) sees it
   with zero changes. Post = any role; template CRUD = can('recurring'). */
function normRecTpl(t){
  t=t||{};
  var d=Math.floor(num(t.dueDay)); if(!(d>=1&&d<=31)) d=1;
  var o={
    id:t.id||uid('rt'),
    name:String(t.name==null?'':t.name),
    amount:num(t.amount),
    category:EXP_CATS.indexOf(t.category)>=0?t.category:'Miscellaneous',
    mode:MODES.indexOf(t.mode)>=0?t.mode:'Cash',
    vendor:t.vendor||'',
    firm:t.firm||'',
    store:(t.store==='WLMHW'||t.store==='HEMW')?t.store:undefined,   // same whitelist as normEntry
    dueDay:d,
    active:t.active!==false,
    createdAt:t.createdAt||new Date().toISOString(),
    createdBy:t.createdBy||role()
  };
  /* CARRY-SAFE BY CONSTRUCTION: unknown future fields pass through, so this
     normaliser can never silently drop a later wave's additions (unlike
     normEntry, which must be edited for every new ledger field). */
  Object.keys(t).forEach(function(k){ if(!(k in o)) o[k]=t[k]; });
  return o;
}
function getRecTpls(){ var a=L(K.rec,[]); return (Array.isArray(a)?a:[]).map(normRecTpl); }   /* non-array corrupt store must not brick renderLedger */
function saveRecTpls(a){ S(K.rec,a.map(normRecTpl)); }
function recDaysInMonth(mm){ return new Date(+mm.slice(0,4), +mm.slice(5,7), 0).getDate(); }
/* one-pass posted map for month mm: { 'rec:<id>:<mm>': count } — non-void rows only,
   so a VOIDED post correctly re-flags the template as unposted. */
function recPostedMap(mm){
  var map={};
  getLedger().forEach(function(e){
    if(!e.void && typeof e.sourceRef==='string' && e.sourceRef.indexOf('rec:')===0 &&
       e.sourceRef.slice(-8)===(':'+mm)) map[e.sourceRef]=(map[e.sourceRef]||0)+1;
  });
  return map;
}
/* due = active, unposted this REAL month, and today >= effective due day
   (dueDay clamped to the month's length so day-31 rent is due in February). */
function recurringDue(){
  try{
    var mm=ym(todayStr()), dNow=+todayStr().slice(8,10), dim=recDaysInMonth(mm), posted=recPostedMap(mm);
    return getRecTpls().filter(function(t){
      return t.active && !posted['rec:'+t.id+':'+mm] && dNow>=Math.min(t.dueDay,dim);
    });
  }catch(e){ return []; }
}

function addRecTpl(){
  if(isPast()){ toast('Historical view is read-only','err'); return; }
  if(!can('recurring')){ toast('Accounts / Owner only','err'); return; }
  var name=val('rt_name').trim(), amt=num(val('rt_amt')), day=Math.floor(num(val('rt_day')));
  if(!name){ toast('Template name is required','err'); return; }
  if(!(amt>0)){ toast('Enter a typical amount greater than 0','err'); return; }
  if(!(day>=1&&day<=31)){ toast('Due day must be between 1 and 31','err'); return; }
  var tpls=getRecTpls();
  if(tpls.find(function(x){return x.name.toLowerCase()===name.toLowerCase();}) &&
     !confirm('A template named "'+name+'" already exists. Add another?')) return;
  tpls.push(normRecTpl({name:name,amount:amt,category:val('rt_cat'),mode:val('rt_mode'),
    vendor:val('rt_vendor').trim(),firm:val('rt_firm'),store:val('rt_store'),dueDay:day,active:true,createdBy:role()}));
  saveRecTpls(tpls); audit('recurring.add',name+' · '+nINR(amt)+' · day '+day);
  toast('Recurring template added','ok'); renderLedger();
}
function editRecTpl(id){
  if(isPast()){ toast('Historical view is read-only','err'); return; }
  if(!can('recurring')){ toast('Accounts / Owner only','err'); return; }
  var tpls=getRecTpls(), t=tpls.find(function(x){return x.id===id;}); if(!t) return;
  /* ID discipline: modal uses re_* ids — the inline add-form (rt_*) stays in the
     Ledger DOM while the modal is open and getElementById returns the first match.
     t.id never changes on edit (sourceRef continuity). */
  modal('Edit template — '+esc(t.name),
    fld('Name','<input id="re_name" value="'+esc(t.name)+'">')+
    fld('Typical amount (₹)','<input id="re_amt" type="number" min="0" step="0.01" value="'+t.amount+'">')+
    fld('Category','<select id="re_cat">'+EXP_CATS.map(function(c){return '<option'+(c===t.category?' selected':'')+'>'+c+'</option>';}).join('')+'</select>')+
    fld('Mode','<select id="re_mode">'+MODES.map(function(m){return '<option'+(m===t.mode?' selected':'')+'>'+m+'</option>';}).join('')+'</select>')+
    fld('Due day of month (1–31)','<input id="re_day" type="number" min="1" max="31" value="'+t.dueDay+'">')+
    fld('Vendor / payee','<input id="re_vendor" value="'+esc(t.vendor)+'">')+
    fld('Firm','<select id="re_firm">'+orgFirms().map(function(f){return '<option'+(f===t.firm?' selected':'')+'>'+esc(f)+'</option>';}).join('')+'</select>')+
    fld('Store (cash drawer)','<select id="re_store">'+storeOpts(t.store||'')+'</select>'),
    async function(){
      var name=val('re_name').trim(), amt=num(val('re_amt')), day=Math.floor(num(val('re_day')));
      if(!name){ toast('Template name is required','err'); return false; }
      if(!(amt>0)){ toast('Enter a typical amount greater than 0','err'); return false; }
      if(!(day>=1&&day<=31)){ toast('Due day must be between 1 and 31','err'); return false; }
      t.name=name; t.amount=amt; t.category=val('re_cat'); t.mode=val('re_mode'); t.dueDay=day;
      t.vendor=val('re_vendor').trim(); t.firm=val('re_firm');
      t.store=(function(){var s=val('re_store');return (s==='WLMHW'||s==='HEMW')?s:undefined;})();
      saveRecTpls(tpls); audit('recurring.edit',t.id+' · '+name+' · '+nINR(amt)+' · day '+day);
      toast('Template updated','ok'); renderLedger(); return true;
    });
}
function toggleRecTpl(id){
  if(isPast()){ toast('Historical view is read-only','err'); return; }
  if(!can('recurring')){ toast('Accounts / Owner only','err'); return; }
  var tpls=getRecTpls(), t=tpls.find(function(x){return x.id===id;}); if(!t) return;
  t.active=!t.active; saveRecTpls(tpls);
  audit('recurring.toggle',t.name+' → '+(t.active?'active':'inactive'));
  toast(t.name+(t.active?' activated':' deactivated'),'ok'); renderLedger();
}
function delRecTpl(id){
  if(isPast()){ toast('Historical view is read-only','err'); return; }
  if(!can('recurring')){ toast('Accounts / Owner only','err'); return; }
  var tpls=getRecTpls(), t=tpls.find(function(x){return x.id===id;}); if(!t) return;
  if(!confirm('Delete template "'+t.name+'"? Ledger entries already posted from it are kept.')) return;
  saveRecTpls(tpls.filter(function(x){return x.id!==id;}));
  audit('recurring.remove',t.name); toast('Template deleted','ok'); renderLedger();
}
function postRecurring(id){
  if(isPast()){ toast('Historical view is read-only. Switch to today to post.','err'); return; }
  var t=getRecTpls().find(function(x){return x.id===id;}); if(!t) return;
  if(!t.active){ toast('Template is inactive — activate it to post','warn'); return; }
  var date=todayStr();
  if(getStmt(date).closed){ toast('Today’s cash statement is locked. Owner must reopen it first.','err'); return; }
  var mm=ym(date), ref='rec:'+t.id+':'+mm;
  /* P1-18: month-lock gate. The Owner override is ABSORBED into this post modal (warn
     banner + required rp_rsn) instead of chaining lockedMonthOverrideModal — modal()
     rewrites #modalRoot wholesale, so chaining is unimplementable (Wave-10 decision #3).
     Same owner-only gate, same mandatory reason, same 'locked-month-override' audit
     action, same markFeedStale call as the addEntry/pettyOut two-step pattern. */
  var __mLock=isMonthLocked(date);
  if(__mLock && !can('monthoverride')){ toast('Month '+mm+' is tax-locked — its tax feed was already generated. Owner override required.','err'); return; }
  var already=getLedger().filter(function(e){return !e.void && e.sourceRef===ref;});
  modal('Post recurring — '+esc(t.name),
    (__mLock?'<div class="banner warn" style="margin-bottom:10px">⚠ <div>Month '+mm+' is tax-locked. Posting records an Owner override and marks the '+mm+' tax feed stale.</div></div>':'')+
    (already.length?'<div class="banner warn">⚠ <div>Already posted for '+mm+' ('+already.length+
      ' entr'+(already.length===1?'y':'ies')+' · '+nINR(already.reduce(function(s,e){return s+e.amount;},0))+
      '). Confirming will post ANOTHER entry for this month.</div></div>':'')+
    '<p class="small muted" style="margin-bottom:10px">'+esc(t.category)+' · '+esc(t.mode)+
      (t.vendor?' · '+esc(t.vendor):'')+(t.firm?' · '+esc(t.firm):'')+' · posts to today ('+date+') as an expense.</p>'+
    fld('Amount for this month (₹)','<input id="rp_amt" type="number" min="0" step="0.01" value="'+t.amount+'">')+
    (__mLock?fld('Override reason','<input id="rp_rsn" placeholder="required — why this late change?">','full'):''),
    async function(){
      var amt=num(val('rp_amt'));
      if(!(amt>0)||!isFinite(amt)){ toast('Enter an amount greater than 0','err'); return false; }
      var rsn=null;
      if(__mLock){ rsn=val('rp_rsn').trim(); if(!rsn){ toast('Override reason is required','err'); return false; } }
      /* R0-W1 SEC-04: locked-month override only — do not remove the __mLock guard. */
      if(__mLock && !await stReauth('Post a recurring entry into the tax-locked month'))return false;
      commitRecurringPost(t,amt,rsn);
      return true;
    });
}
/* pure commit (modal-driven via postRecurring; 3-arg since Wave-10 Phase A so the
   P1-18 override lands without reopening this signature — ovRsn is the locked-month
   override reason, null on the normal path). */
function commitRecurringPost(t,amt,ovRsn){
  var date=todayStr(), mm=ym(date), ref='rec:'+t.id+':'+mm;
  if(isPast()){ toast('Historical view is read-only','err'); return; }                       // defence in depth
  if(getStmt(date).closed){ toast('Day locked — reopen first','err'); return; }              // re-check: modal may sit open across a close
  /* P1-18: defensive month-lock gate — the modal may sit open across a feed generate. */
  if(isMonthLocked(date) && !ovRsn){ if(!can('monthoverride')){ toast('Month '+mm+' is tax-locked — its tax feed was already generated. Owner override required.','err'); } else { toast('Override reason is required','err'); } return; }
  var led=getLedger();                                                                        // FRESH read inside the commit (exp-bug-01 pattern)
  led.push(normEntry({id:uid('e'),type:'expense',date:date,amount:amt,category:t.category,
    mode:t.mode,vendor:t.vendor,firm:t.firm,store:t.store,description:t.name+' — '+mm,
    source:'recurring',sourceRef:ref,status:'pending',createdBy:role()}));
  saveLedger(led);
  if(t.vendor){ var vs=L(K.vend,[]); if(!vs.find(function(v){return v.name.toLowerCase()===t.vendor.toLowerCase();})){ vs.push({name:t.vendor}); S(K.vend,vs); } }   // mirrors addEntry vendor auto-add
  audit('recurring.post',t.name+' · '+nINR(amt)+' · '+mm);
  if(ovRsn){ audit('locked-month-override','recurring '+t.id+' · '+date+' · '+nINR(amt)+' · '+ovRsn); markFeedStale(mm); }   // P1-18
  toast('Posted '+t.name+' '+nINR(amt)+' — also in today’s cash statement','ok');
  budgetAlertToast(t.category,date);   // P1-19: rent/salary are the biggest budget heads — the live alert applies here too
  render();
}

var SD=asOf();

/* Wave-5: segmented scope control [ All (business) | store… ] shown atop the tab. */
function stScopeBar(){
  var btns='<button data-action="filter-statement-all-stores" data-saagar-args="'+jargs('')+'" class="'+(SST===''?'on inc':'')+'">All (business)</button>'+
    orgStores().map(function(s){ return '<button data-action="filter-statement-store" data-saagar-args="'+jargs(s.code)+'" class="'+(SST===s.code?'on inc':'')+'">'+esc(s.name)+'</button>'; }).join('');
  return '<div class="seg" style="margin-bottom:14px">'+btns+'</div>';
}
/* Wave-5: compact both-drawer status strip for the All (business) view. */
function stDrawerStrip(){
  var rows=orgStores().map(function(s){
    var d=computeDayStore(SD,s.code), sub=((getStmt(SD).byStore)||{})[s.code]||{};
    var counted=denoTotal(sub.physDeno), delta=counted-d.expectedClosing;
    var status=sub.closed?'<span class="bdg locked">closed</span>'
      :(counted===0?'<span class="bdg warn">not counted</span>'
        :(Math.abs(delta)<1?'<span class="bdg ok">balanced</span>':'<span class="bdg exp">mismatch '+(delta>0?'+':'')+nINR(delta)+'</span>'));
    return '<div class="st-row"><span class="d">'+esc(s.name)+' · '+nINR(counted)+' counted vs '+nINR(d.expectedClosing)+' expected</span><span>'+status+'</span></div>';
  }).join('');
  return '<div class="st-box" style="margin-bottom:14px"><div class="st-th">PER-STORE DRAWERS (soft reconciliation)</div>'+rows+
    '<div class="st-row"><span class="d muted small">Untagged legacy/bridge entries are not attributed to a store — they appear only here in the business day.</span><span></span></div></div>';
}
function renderStmt(){
  if(SST!==''){ renderStmtStore(SST); return; }
  var d=computeDay(SD), st=getStmt(SD);
  var counted=denoTotal(st.physDeno), bankDep=denoTotal(st.bankDeno);
  var delta=counted-d.expectedClosing, bal=Math.abs(delta)<1;
  var locked=st.closed;
  // VIEW-ONLY history: when the SELECTED statement day is before today, the
  // whole tab is read-only — deno inputs disabled, no close/approve/reopen.
  var pastDay=SD<todayStr(), ro=locked||pastDay;
  document.getElementById('stmtC').innerHTML =
  '<div class="card"><div class="card-h"><div><h3>Daily Cash Statement</h3><p>Auto-built from the ledger. Rows are read-only — add money in the Ledger tab.</p></div>'+

   stScopeBar()+

/* PRINT: rebuild the Cash Statement for SD as a self-contained doc for the on-screen
   preview bridge. Uses ONLY the shared .stp-* theme injected by the shell. */
function printStmt(){
  // Wave-5: when a store scope is active, print that drawer (computeDayStore +
  // st.byStore[store] deno). When SST==='' this is byte-identical to before.
  var __store=SST||null;
  var st=getStmt(SD);
  var d=__store?computeDayStore(SD,__store):computeDay(SD);
  var __deno=__store?(((st.byStore)||{})[__store]||{physDeno:{},bankDeno:{}}):st;
  var counted=denoTotal(__deno.physDeno), bankDep=denoTotal(__deno.bankDeno);
  var carry=Math.max(counted-bankDep,0);
  var __scopeLbl=__store?(' · '+storeName(__store)):'';
  var inflows=d.rows.filter(function(e){return e.type==='income' && e.mode==='Cash';});
  var outflows=d.rows.filter(function(e){return e.type==='expense' && e.mode==='Cash';});
  var hasAny = d.opening>0 || inflows.length || outflows.length || counted>0;

  function rowsHtml(list,empty){
    if(!list.length) return '<tr><td class="stp-mut">'+stEsc(empty)+'</td><td class="stp-c stp-r stp-mut">'+stEsc(nINR(0))+'</td></tr>';
    return list.map(function(e){
      var lbl=e.description||e.category||'—';
      if(e.source) lbl+=' ('+e.source+')';
      return '<tr><td>'+stEsc(lbl)+'</td><td class="stp-c stp-r">'+stEsc(nINR(e.amount))+'</td></tr>';
    }).join('');
  }

  var body=''+
    '<div class="stp-head">'+
      '<div class="stp-brand">Saagar Traders<small>Expense · Cash</small></div>'+
      '<div class="stp-title">Cash Statement<small>'+stEsc(SD+__scopeLbl)+'</small></div>'+
    '</div>'+
    '<div class="stp-meta">Saagar Traders'+stEsc(__scopeLbl)+' · Statement date '+stEsc(SD)+' · Prepared by '+stEsc(role())+
      (__store
        ? ((((st.byStore)||{})[__store]||{}).closed?(' · Drawer closed ('+stEsc(((((st.byStore)||{})[__store]||{}).closedBy)||'?')+')'):'')
        : (st.closed?(' · Closed ('+stEsc((st.closedBy||'?'))+')'):''))+'</div>';

  if(!hasAny){
    body+='<div class="stp-empty">No cash statement for this date.</div>';
  } else {
    body+=''+
    '<div class="stp-sec"><div class="stp-sec-t">Receipts (cash in)</div>'+
      '<table class="stp-table" data-saagar-print-table-strategy="priority" data-saagar-table-workflow="statement-inflows"><thead><tr><th>Particulars</th><th class="stp-c stp-r">Amount</th></tr></thead>'+
      '<tbody>'+
        '<tr><td>Opening balance (carry-forward)</td><td class="stp-c stp-r">'+stEsc(nINR(d.opening))+'</td></tr>'+
        rowsHtml(inflows,'— none —')+
      '</tbody>'+
      '<tfoot><tr class="stp-tot"><td>Total cash available</td><td class="stp-c stp-r">'+stEsc(nINR(d.opening+d.cashIn))+'</td></tr></tfoot>'+
      '</table></div>'+
    '<div class="stp-sec"><div class="stp-sec-t">Payments (cash out)</div>'+

/* ── P1-19: entry-time budget alert + copy-last-month budgets ─────────────── */
/* Reuses renderBudget's math EXACTLY: bucket = date.slice(0,7), spend = Σ non-void
   EXPENSE rows of the category in that month, pct = Math.round(ac/bg*100).
   Toast thresholds per register: >=90 warn, >=100 err. (The Budgets-tab 85%
   "near limit" pill is deliberately UNCHANGED.) */
function budgetAlertFor(cat,date){
  var m=(date||'').slice(0,7);
  if(m!==ym(todayStr())) return null;              // current REAL month only
  var bg=num((L(K.budg,{})[m]||{})[cat]);
  if(!(bg>0)) return null;                          // no budget set → silent
  var ac=0; getLedger().forEach(function(e){
    if(!e.void && e.type==='expense' && e.category===cat && e.date.slice(0,7)===m) ac+=e.amount;
  });
  var pct=Math.round(ac/bg*100);
  if(pct<90) return null;
  var mon=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m.slice(5,7)-1]||m;
  return {msg:cat+' now '+pct+'% of '+mon+' budget',style:pct>=100?'err':'warn'};
}
var __budgAlertT=null;
/* Chain AFTER the save toast: toast() is ONE #toast element with a 2600ms hide
   timer — an immediate second call would REPLACE the save confirmation. Compute
   NOW (post-saveLedger, correct data), display at +1600ms so the user sees BOTH:
   save toast ~1.6s, then the alert for its full 2600ms. clearTimeout dedupes
   rapid consecutive saves (only the latest alert shows). */
function budgetAlertToast(cat,date){
  clearTimeout(__budgAlertT);   // always cancel a pending alert — a corrective save must not let a stale one fire
  var a=budgetAlertFor(cat,date); if(!a) return;
  __budgAlertT=setTimeout(function(){ toast(a.msg,a.style); },1600);

function prevYM(m){ var y=+m.slice(0,4), mo=+m.slice(5,7)-1; if(mo<1){ y--; mo=12; } return y+'-'+p2(mo); }
/* Non-destructive merge: fills ONLY heads with no value (>0) this month. A 0 value is
   "no value": setBudget stores num('')→0 when an input is cleared, and renderBudget
   renders bg=0 as "no budget", so 0 is not a deliberate cap in this model.
   Write month = ym(todayStr()) mirroring setBudget; no role gate — same openness
   as per-cell setBudget (can() has no budget action); isPast() guard mirrors it too. */
function copyBudgets(){
  if(isPast()){ toast('Historical view is read-only','err'); return; }
  var m=ym(todayStr()), pm=prevYM(m), b=L(K.budg,{}), src=b[pm]||{}, bm=b[m]||{};
  if(!src||typeof src!=='object'||Array.isArray(src)) src={};
  if(!bm ||typeof bm !=='object'||Array.isArray(bm))  bm={};   // corrupt month value must not silently no-op the merge
  if(!EXP_CATS.some(function(c){ return num(src[c])>0; })){ toast('No budgets found for '+pm,'warn'); return; }
  var heads=EXP_CATS.filter(function(c){ return num(src[c])>0 && !(num(bm[c])>0); });
  if(!heads.length){ toast('Every head already has a budget for '+m,'ok'); return; }
  if(!confirm('Copy '+heads.length+' budget head'+(heads.length>1?'s':'')+' from '+pm+' into '+m+'? Heads that already have a value are left unchanged.')) return;
  b[m]=bm; heads.forEach(function(c){ bm[c]=num(src[c]); });
  S(K.budg,b); audit('budget.copy',pm+' → '+m+' · '+heads.length+' head(s)');
  toast('Copied '+heads.length+' budget head'+(heads.length>1?'s':'')+' from '+pm,'ok');
  renderBudget();
}

function feedItems(){
  var items=[]; var posted={}; getLedger().forEach(function(e){ if(e.sourceRef) posted[e.sourceRef]=true; });
  // WSC — saagar_wsf_v2 closed cases → income
  try{ var w=L('saagar_wsf_v2',[]); if(Array.isArray(w)) w.forEach(function(c){
    if((c.status||'')==='closed'){ var ref='wsc_'+c.id, amt=num((c.delivery&&c.delivery.finalAmt)||c.estTotal);
      if(amt>0) items.push({src:'wsc',ref:ref,type:'income',date:(c.closedAt||todayStr()).slice(0,10),amount:amt,category:'Service Income',mode:((c.delivery&&c.delivery.payMode)||'Cash'),desc:'WSC '+(c.custName||'service')+' '+(c.brand||''),posted:!!posted[ref]});
    }});}catch(e){}
  // Payroll — payroll_suite_v1_2026 → monthly expense per firm
  try{ var pb=L('payroll_suite_v1_2026',null);
    if(pb&&pb.meta&&Array.isArray(pb.rows)){ var byFirm={}; pb.rows.forEach(function(r){ var f=(r.firm||'GM'); byFirm[f]=(byFirm[f]||0)+num(r.gross||r.salaryAmount); });
      Object.keys(byFirm).forEach(function(f){ var ref='pay_'+pb.meta.year+'_'+pb.meta.month+'_'+f, dt=pb.meta.year+'-'+p2(pb.meta.month||1)+'-28';
        items.push({src:'payroll',ref:ref,type:'expense',date:dt,amount:byFirm[f],category:'Salary',mode:'Bank',desc:'Payroll '+f+' M'+pb.meta.month+'/'+pb.meta.year,posted:!!posted[ref]});
      });}}catch(e){}
  // Stock — saagar_stock_<store>_<date> GRN → expense
  try{ for(var i=0;i<localStorage.length;i++){ var key=localStorage.key(i);
      var mm=key&&key.match(/^saagar_stock_(titanworld|helios|WLMHW|HEMW)_(\d{4}-\d{2}-\d{2})$/);
      if(mm){ var blob=L(key,{}),grn=0,mv=(blob&&blob.movements)||{}; Object.keys(mv).forEach(function(bk){ var row=mv[bk]; if(row&&row.grn) grn+=num(row.grn); });
        if(grn>0){ var ref='grn_'+mm[1]+'_'+mm[2]; items.push({src:'stock',ref:ref,type:'expense',date:mm[2],amount:grn,category:'Inventory',mode:'Bank',desc:'GRN cost '+mm[1]+' '+mm[2],posted:!!posted[ref]}); } } } }catch(e){}

      if((c.outcome||'').toLowerCase()==='purchase'&&num(c.purchaseAmount||c.amount)>0){ var ref='qms_'+(c.id||c.mobile);
        items.push({src:'qms',ref:ref,type:'income',date:((c.exitTime||c.entryTime||c.walkInTime||todayStr())+'').slice(0,10),amount:num(c.purchaseAmount||c.amount),category:'Retail Sale',mode:(c.paymentMode||'Cash'),desc:'QMS sale '+(c.name||c.billNo||''),posted:!!posted[ref]});
      }});}catch(e){}

  var cats=window.__gstCats||[], c=cats[parseInt(el.getAttribute('data-i'),10)]; if(c==null) return;

function genTaxFeed(){
  if(isPast()){ toast('Historical view is read-only — month-lock is available only for today','err'); return; }
  if(!can('monthlock')){ toast('Owner only','err'); return; }
  /* A feed locks the month (P1-18): a FUTURE month must never be lockable — there is no in-app unlock.
     Also rejects an empty/cleared month picker (would write a junk feed[''] key). */
  if(!CM || !/^\d{4}-\d{2}$/.test(CM) || CM>ym(todayStr())){ toast('Pick the current or a past month — a future month cannot be locked','err'); return; }
  var led=getLedger().filter(function(e){return !e.void&&e.date.slice(0,7)===CM;});
  var inc=led.filter(function(e){return e.type==='income';}).reduce(function(s,e){return s+e.amount;},0);
  var exp=led.filter(function(e){return e.type==='expense';}).reduce(function(s,e){return s+e.amount;},0);
  var gst=num(L(K.set,{}).gstRate);
  /* P1-17: same per-category computation as renderClose (unset category → flat default). */
  var rates=L(K.gstRates,{}); if(!rates||typeof rates!=='object'||Array.isArray(rates)) rates={};
  /* Same collision-proof lookups + junk-tolerant rateFor as renderClose (keep the two in lockstep). */
  var incByCat=Object.create(null); led.forEach(function(e){ if(e.type==='income') incByCat[e.category]=(incByCat[e.category]||0)+e.amount; });
  var rateFor=function(c){ if(!Object.prototype.hasOwnProperty.call(rates,c)) return gst; var v=rates[c]; var n=(typeof v==='number')?v:((typeof v==='string'&&String(v).trim()!=='')?+v:NaN); return isFinite(n)?n:gst; };
  var gstEst=0, gstByCat=Object.create(null);
  Object.keys(incByCat).forEach(function(c){ var r=rateFor(c); var v=incByCat[c]*r/100; gstByCat[c]={income:incByCat[c],ratePct:r,estimate:v}; gstEst+=v; });
  var gstPaid=led.filter(function(e){return e.type==='expense';}).reduce(function(s,e){return s+num(e.gstAmount);},0);
  var byCat={}; led.forEach(function(e){ byCat[e.type+':'+e.category]=(byCat[e.type+':'+e.category]||0)+e.amount; });
  var feed=L(K.tax,{});
  /* Wholesale month-object replace. MUST NOT re-add the P1-18 freshness keys — this
     replace IS the auto-clear-on-regenerate (markFeedStale is their only writer). */
  feed[CM]={month:CM,income:inc,expense:exp,net:inc-exp,gstRate:gst,gstEstimate:gstEst,byCategory:byCat,
            gstRates:rates,gstEstimateByCat:gstByCat,gstPaidOnPurchases:gstPaid,   /* P1-17 additive */
            generatedAt:new Date().toISOString(),by:role()};
  S(K.tax,feed);
  // mark days of month locked
  var st=L(K.stmt,{}); Object.keys(st).forEach(function(dk){ if(dk.slice(0,7)===CM){ st[dk].monthLocked=true; } }); S(K.stmt,st);
  audit('month.lock',CM+' tax feed generated; income '+nINR(inc)+' expense '+nINR(exp));
  toast('Tax feed generated & month locked','ok'); renderClose();
}
