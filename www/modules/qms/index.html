<script>
'use strict';
const STORE_KEY='retail_queue_management_v1';
const todayISO=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};   /* audit: local date — toISOString gave the previous day in IST */
const uid=(p='id')=>p+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8);
const $=id=>document.getElementById(id);
const fmtTime=iso=>iso?new Date(iso).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}):'—';
const fmtDT=iso=>iso?new Date(iso).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const minsBetween=(a,b)=>a&&b?Math.max(0,Math.round((new Date(b)-new Date(a))/60000)):0;
const esc=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
function stEsc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* P1-42: repeat-customer recognition — READ-ONLY cross-frame lookup of the bridge-derived customer master. */
function _qmsNorm10(m){var d=String(m==null?'':m).replace(/\D/g,'');return d.length>=10?d.slice(-10):'';}
function _qmsMaster(){try{var ls=(window.parent&&window.parent!==window)?SaagarModuleBridge.sharedStorage:localStorage;var raw=ls.getItem('saagar_customer_master_v1');if(!raw)return null;var o=JSON.parse(raw);return (o&&o.byMobile)?o:null;}catch(e){return null;}}
function stPrintDoc(o){return SaagarModuleRuntime.printDocument(o,function(){toast('Controlled print is available only inside Saagar Control Centre.','error');});}
let state,role='SM',activeView='dashboard',toastTimer;
/* ===== View-date rail (shell-provided): window.__stAsOf = 'YYYY-MM-DD' the user wants to VIEW.
   A PAST date (asOf < real today) is VIEW-ONLY: render that day read-only, never write/auto-create. ===== */
let viewAsOf=todayISO();
function readAsOf(){const d=window.__stAsOf;return(typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d))?d:todayISO();}
function isPast(){return viewAsOf<todayISO();}
function eodLockActive(){return !!state&&!!state.settings&&state.settings.lockEditsAfterEOD&&!currentRotation()&&state.rotations.some(r=>r.date===todayISO()&&r.status==='Closed');}
/* Central write guard for ALL customer/rotation mutators: blocks writes on a past read and after EOD lock. */
function guardWrite(){if(!guardPast())return false;if(eodLockActive()){toast('Edits locked after EOD close.','error');return false;}return true;}
/* Past-only guard: blocks writes on a past read but NOT the EOD lock (used by the fresh-rotation recovery path). */
function guardPast(){if(isPast()){toast('Viewing a past date — read-only.','warn');return false;}return true;}
const PAGE_TITLES={dashboard:'Dashboard',rotation:'CRO Rotation',entry:'Customer Entry',preclaim:'Pre-Claims',live:'Live Queue',followups:'Follow-ups',reports:'Reports',settings:'Settings'};
const DEFAULT_CROS=[];
const DEFAULT_SETTINGS={storeName:'Saagar Traders',ownerWhatsApp:'',queuePrefix:'Q',waitAlertMins:10,autoAllocate:true,requireBillForPurchase:true,requireJobForService:true,allowGreeterClose:false,smCanGiveNextOpportunity:true,lockEditsAfterEOD:true};
function initialState(){return{settings:{...DEFAULT_SETTINGS},role:'SM',cros:DEFAULT_CROS,rotations:[],customers:[],followups:[],audit:[],lastBackup:null,queueSeq:{}}}
function load(){try{var __p=JSON.parse(localStorage.getItem(STORE_KEY)||'null');state=(__p&&typeof __p==='object'&&!Array.isArray(__p))?__p:initialState()}catch(e){state=initialState()}state.settings={...DEFAULT_SETTINGS,...(state.settings||{})};state.cros=Array.isArray(state.cros)?state.cros:[];state.cros=state.cros.filter(function(c){return !(c&&/^(Rahul|Priya|Neha|Amit|Suresh)$/i.test(String(c.name||'').trim())&&/^CRO-0[0-9]$/.test(String(c.code||'')));});try{var __m=JSON.parse(localStorage.getItem('saagar_employee_master_v1')||'[]');if(Array.isArray(__m)){var __seen={};state.cros.forEach(function(c){if(c&&c.name)__seen[String(c.name).trim().toLowerCase()]=1;});__m.filter(function(x){return x&&x.name&&x.active!==false;}).forEach(function(x){var __k=String(x.name).trim().toLowerCase();if(!__seen[__k]){__seen[__k]=1;state.cros.push({id:'emp_'+String(x.name).toLowerCase().replace(/[^a-z0-9]/g,''),name:x.name,code:'CRO-'+('0'+(state.cros.length+1)).slice(-2),active:true});}});}}catch(e){}state.rotations=state.rotations||[];state.customers=state.customers||[];state.followups=state.followups||[];state.preclaims=Array.isArray(state.preclaims)?state.preclaims:[];state.preclaims.forEach(function(p){if(p&&p.status==='Active'&&(p.date||'').slice(0,10)!==todayISO())p.status='Expired';});state.audit=state.audit||[];if(!state.queueSeq||typeof state.queueSeq!=='object'){state.queueSeq={};}state.customers.forEach(function(c){if(!c)return;var d=customerBusinessDate(c);if(!d)return;var m=/(\d+)\s*$/.exec(String(c.queueNo||''));var n=m?parseInt(m[1],10):0;var cur=state.queueSeq[d]||0;state.queueSeq[d]=Math.max(cur,n);});/* ensure each day's counter is at least the count of its customers (covers legacy non-numeric queue ids) */var __byDay={};state.customers.forEach(function(c){if(!c)return;var d=customerBusinessDate(c);if(!d)return;__byDay[d]=(__byDay[d]||0)+1;});Object.keys(__byDay).forEach(function(d){state.queueSeq[d]=Math.max(state.queueSeq[d]||0,__byDay[d]);});role=state.role||'SM'}
function qmsPolicyApi() {
  /* D2-QMS-2026-07-30 */
  try {
    return (window.parent && window.parent !== window && SaagarModuleBridge.qmsPolicy) ||
      SaagarModuleBridge.qmsPolicy || null;
  } catch (error) {
    return null;
  }
}
function qmsPersistenceApi() {
  try {
    return (window.parent && window.parent !== window && SaagarModuleBridge.qmsPersistence) ||
      SaagarModuleBridge.qmsPersistence || null;
  } catch (error) {
    return null;
  }
}
function qmsRestorePersistedState() {
  /* D2-QMS-RESILIENCE-2026-07-30 */
  load();
  renderAll();
}
function qmsPrepareFastOutcome(customer) {
  if (!customer || !customer.assignedCroId) return false;
  customer.attendStart = customer.attendStart || new Date().toISOString();
  customer.status = 'In Discussion';
  addAudit('customer.attend.start', {
    queueNo: customer.queueNo,
    source: 'fast-outcome'
  }, true);
  return true;
}
function save(action, details) {
  const persistence = qmsPersistenceApi();
  if (!persistence || typeof persistence.commit !== 'function') {
    qmsRestorePersistedState();
    toast('Save control unavailable. Nothing was changed.', 'error');
    return false;
  }
  const auditEntry = action ? {
    id: uid('aud'),
    at: new Date().toISOString(),
    role,
    action,
    details: details || {}
  } : null;
  if (!persistence.commit(localStorage, STORE_KEY, state, auditEntry, 600)) {
    qmsRestorePersistedState();
    toast('Save failed. Your previous saved data is unchanged; retry when storage is available.', 'error');
    return false;
  }
  renderAll();
  return true;
}
function addAudit(action, details = {}, skipSave = false) {
  if (!skipSave) return save(action, details);
  state.audit.unshift({ id: uid('aud'), at: new Date().toISOString(), role, action, details });
  state.audit = state.audit.slice(0, 600);
  return true;
}
function toast(msg,type=''){const t=$('toast');t.textContent=msg;t.className='toast show '+type;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800)}
function requireSM(){if(role!=='SM'&&role!=='Admin'){toast('SM / Admin access required.','error');return false}return true}
function closeModal(){$('modalBackdrop').classList.add('hidden');$('modalBody').innerHTML='';$('modalFoot').innerHTML=''}
function openModal(title,body,foot='',small=false){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalFoot').innerHTML=foot;$('modalBox').className='modal'+(small?' small':'');$('modalBackdrop').classList.remove('hidden')}
function switchView(name){activeView=name;document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));$('view-'+name).classList.add('active');document.querySelectorAll('.nav-item').forEach(b=>b.classList.remove('active'));$('nav-'+name).classList.add('active');$('topbarTitle').textContent=PAGE_TITLES[name]||name;renderAll();/* Audit fix qms-L03: auto-close the shell mobile nav drawer after a nav item is chosen (it used to stay open over the content) */try{var __sb=document.querySelector('.sidebar');if(__sb)__sb.classList.remove('open');var __sc=document.getElementById('st-v5-qms-scrim');if(__sc)__sc.classList.remove('show');}catch(e){}}
function switchRole(){if(!guardPast())return;const roles=['SM','Greeter','CRO','Admin'];role=roles[(roles.indexOf(role)+1)%roles.length];state.role=role;if(!save('role.switch',{role}))return;toast('Role: '+role)}
function tick(){const d=new Date();$('clockTime').textContent=d.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});$('clockDate').textContent=d.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short'})}
setInterval(tick,1000);
/* Idle refresh: wait badges + attention alerts are computed inside renderAll(), which otherwise runs only on user action — so the waitAlertMins alert never trips on an untouched screen. Re-render every 45s, but ONLY on Live Queue / Dashboard, and never while the tab is hidden, a modal is open, or a form control has focus (re-render would wipe typed input). */
setInterval(function(){if(document.hidden)return;if(activeView!=='live'&&activeView!=='dashboard')return;if(!$('modalBackdrop').classList.contains('hidden'))return;const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT'||ae.tagName==='TEXTAREA'))return;renderAll()},45000);
function currentRotation(){if(isPast())return state.rotations.find(r=>r.date===viewAsOf)||null;return state.rotations.find(r=>r.date===todayISO()&&r.status==='Active')||null}
function indiaBusinessDateFromIso(value) {
  const time = Date.parse(value || '');
  if (!Number.isFinite(time)) return '';
  return new Date(time + 330 * 60000).toISOString().slice(0, 10);
}
function customerBusinessDate(customer) {
  /* D2-QMS-HARDENING-2026-07-30 */
  /* D2-QMS-CLEANUP-2026-07-30 */
  const explicit = String((customer && customer.businessDate) || '');
  return /^\d{4}-\d{2}-\d{2}$/.test(explicit)
    ? explicit
    : indiaBusinessDateFromIso(customer && customer.entryTime);
}
function todaysCustomers() {
  return state.customers.filter(customer => customerBusinessDate(customer) === viewAsOf);
}
function activeCustomers(){return todaysCustomers().filter(c=>c.status!=='Closed')}
function customerById(id){return state.customers.find(c=>c.id===id)}
/* ===== W2-3: DSR→QMS write-back (close-the-loop). A CRO marking a queue walk-in "Purchase" in the DSR
   Visitors tab (and saving bill+amount) makes the integration bridge emit a DSR_PURCHASE event on the
   shared bus (saagar_bus). QMS READS that bus here — it never writes it — and flags the matching OPEN
   lead "Purchased in DSR — confirm & close" with the close modal pre-filled. The SM still confirms
   through the NORMAL close path (confirmCloseLead), so conversion %, sales ₹, follow-ups, the audit
   trail and the bridge's QMS→DSR push-suppression all stay consistent. A Closed lead never flags; a
   DSR purchase with no matching lead renders nothing. The map is refreshed at the top of renderAll(),
   so the existing 45s Live/Dashboard idle tick surfaces a new flag without reopening the module. ===== */
function dsrPurchaseMap(){try{const b=JSON.parse(localStorage.getItem('saagar_bus')||'[]');const m={};if(Array.isArray(b))b.forEach(e=>{if(e&&e.type==='DSR_PURCHASE'&&e.payload&&e.payload.cid)m[String(e.payload.cid)]=e.payload});return m}catch(e){return{}}}
let _dsrPurch={};
function dsrPurchaseFor(c){if(!c||c.status==='Closed')return null;return _dsrPurch[String(c.id)]||null}
function croName(id){return state.cros.find(c=>c.id===id)?.name||'—'}
const kk=n=>String(n??'').trim().toLowerCase();
function leaveUnavailableMap(){try{const g=JSON.parse(localStorage.getItem('saagar_gate_status')||'null');const u=g&&g.unavailable;return(u&&typeof u==='object')?u:{}}catch(e){return{}}}
function isLeaveUnavailableToday(name){const e=leaveUnavailableMap()[kk(name)];return !!(e&&e.leave===true)}
function availableCros(){const u=leaveUnavailableMap();return state.cros.filter(c=>c.active&&!(u[kk(c.name)]&&u[kk(c.name)].leave===true))}
function rotationItem(rot,croId){return rot?.items?.find(i=>i.croId===croId)}
function activeRotationItems(rot=currentRotation()){return(rot?.items||[]).filter(i=>i.active&&i.status!=='Inactive'&&i.status!=='Half Day'&&state.cros.find(c=>c.id===i.croId)?.active)}
/* Persisted MONOTONIC per-day counter so removals / two greeters can't collide on a queue number. */
function fmtQueueNo(n){return`${state.settings.queuePrefix}-${String(n).padStart(3,'0')}`}
function getQueueNo(){state.queueSeq=state.queueSeq||{};return fmtQueueNo((state.queueSeq[todayISO()]||0)+1)}

function calcStats(list=todaysCustomers()){const total=list.length,pur=list.filter(c=>c.outcome==='Purchase').length,svc=list.filter(c=>c.outcome==='Service').length,non=list.filter(c=>c.outcome==='Non Purchase').length,closed=list.filter(c=>c.status==='Closed').length,sales=list.reduce((s,c)=>s+(+c.purchaseAmount||0),0),waits=list.filter(c=>c.attendStart).map(c=>minsBetween(c.entryTime,c.attendStart)),avgWait=waits.length?Math.round(waits.reduce((a,b)=>a+b,0)/waits.length):0,conv=total?Math.round(pur/total*100):0,lost=list.filter(c=>c.outcome==='Non Purchase').reduce((s,c)=>s+(+c.lostValue||0),0);return{total,pur,svc,non,closed,sales,avgWait,conv,lost,open:total-closed}}

/* ===== Phase 1: CRO occupancy ("one active lead in hand") =====
   OFF_FLOOR = statuses that pull a CRO off the floor (skip-with-reason path).
   A CRO is FREE only when on-floor, active, manual-status not Busy, AND holding no open lead. */
const OFF_FLOOR_STATUSES=['Washroom','Tea / Lunch Break','Not Near Entrance','Manager Work','Half Day','Inactive'];
const NOT_FREE_STATUSES=OFF_FLOOR_STATUSES.concat(['Busy']);
/* ===== Phase 6: canonical state vocabulary (documentation + reporting aids; NOT enforced/migrated).
   CUSTOMER_STATES is the ordered customer lifecycle. CRO_AVAIL_STATES are the MANUAL availability
   strings; the full CRO status vocabulary = CRO_AVAIL_STATES ∪ OFF_FLOOR_STATUSES. NOTE: 'Busy' here
   is the MANUAL status string, distinct from the DERIVED occupancy computed by croBusy()/isFreeOnFloor().
   'Billing / Service Desk' is a tolerated legacy alias (see statusConfig) — NOT part of CUSTOMER_STATES. */
const CUSTOMER_STATES=['New Entry','Waiting','Allocated','In Discussion','Awaiting Closure','Closed'];
const CRO_AVAIL_STATES=['Available','Busy'];
/* Non-destructive validator/centralization point for reporting. NEVER rewrites a valid value, NEVER
   throws; returns input unchanged when recognized, 'New Entry' only for empty/nullish. NOT wired into
   any setter in p6 (behavior-preserving). */
function normalizeCustomerStatus(s){const v=String(s||'').trim();if(CUSTOMER_STATES.includes(v))return v;if(v==='Billing / Service Desk')return v;/* tolerated legacy alias */return v||'New Entry';}

   baseline, so these guard for a missing state.preclaims array and return empty/zero gracefully. ===== */

function preclaimsForView(){return(Array.isArray(state.preclaims)?state.preclaims:[]).filter(p=>((p&&(p.date||p.createdAt||''))||'').slice(0,10)===viewAsOf);}
function preclaimStatsByCro(){const map={};preclaimsForView().forEach(p=>{const id=p&&p.croId;if(!id)return;map[id]=map[id]||{honored:0,missed:0};const st=String(p.status||'');if(st==='Honored')map[id].honored++;else if(st==='Missed'||st==='Missed-but-held'||st==='Expired')map[id].missed++;});return map;}

function savePreclaim() {

  const note = $('pcNote') ? $('pcNote').value.trim() : '';

    toast('Select a CRO.', 'error');
    return;

  if (!name) {
    toast('Customer name required.', 'error');
    return;
  }

    return;

    id: uid('pc'),

function qmsReadPendingIntake() {
  /* D2-QMS-LEGAL-RETRY-2026-07-30 */
  const raw = localStorage.getItem(qmsPendingIntakeKey());
  if (!raw) return null;
  let token;
  try {
    token = JSON.parse(raw);
  } catch (error) {
    throw new Error('Pending intake recovery data is unreadable.');
  }
  const customerId = String(token && token.customerId || '');
  const businessDate = String(token && token.businessDate || '');
  if (!token || token.version !== 1 ||
      !/^cust_[a-z0-9_]{6,80}$/.test(customerId) ||
      !/^\d{4}-\d{2}-\d{2}$/.test(businessDate)) {
    throw new Error('Pending intake recovery data is invalid.');
  }
  return {
    version: 1,
    customerId,
    businessDate,
    previewQueueNo: String(token.previewQueueNo || '').slice(0, 40),
    createdAt: String(token.createdAt || '')
  };
}

function confirmCloseLead(id) {
  if (!guardWrite()) return;
  const c = customerById(id);
  if (!c) return;
  const out = $('closeOutcome').value;
  const followupRequired = $('fuReq').value === 'Yes';
  if (followupRequired && !c.mobile) {
    toast('Cannot set a follow-up without a mobile number.', 'error');
    return;
  }

  const staged = {};
  if (out === 'Purchase') {
    const bill = $('billNo').value.trim();
    const amount = Number($('purchaseAmount').value);
    if (state.settings.requireBillForPurchase && !bill) {
      toast('Bill number required.', 'error');
      return;
    }
    if (!Number.isFinite(amount) || amount <= 0) {
      toast('Purchase amount must be greater than zero.', 'error');
      return;
    }
    const reason = qmsValidateOutcome('Purchase', {
      conversionReasonCode: $('conversionReasonCode').value,
      reasonDetail: $('conversionReasonDetail').value
    });
    if (!reason.ok) {
      toast(reason.message, 'error');
      return;
    }
    Object.assign(staged, {
      billNo: bill,
      purchaseAmount: amount,
      purchaseCategory: $('purchaseCategory').value.trim(),
      paymentMode: $('paymentMode').value,
      conversionReasonCode: reason.reasonCode,
      conversionReason: reason.reasonLabel,
      conversionReasonDetail: reason.reasonDetail
    });
  }
  if (out === 'Service') {
    const job = $('jobCardNo').value.trim();
    if (state.settings.requireJobForService && !job) {
      toast('Job card required.', 'error');
      return;
    }
    Object.assign(staged, {
      jobCardNo: job,
      serviceType: $('serviceType').value,
      deliveryDate: $('deliveryDate').value,
      advance: +$('advance').value || 0
    });
  }
  if (out === 'Non Purchase') {
    const reason = qmsValidateOutcome('Non Purchase', {
      lostReasonCode: $('lostReasonCode').value,
      reasonDetail: $('lostReasonDetail').value
    });
    if (!reason.ok) {
      toast(reason.message, 'error');
      return;
    }
    const lostValue = Number($('lostValue').value || 0);
    if (!Number.isFinite(lostValue) || lostValue < 0) {
      toast('Estimated lost value must be zero or more.', 'error');
      return;
    }
    Object.assign(staged, {
      lostReasonCode: reason.reasonCode,
      lostReason: reason.reasonLabel,
      lostReasonDetail: reason.reasonDetail,
      lostValue
    });
  }

  let followupDraft = null;
  if (followupRequired) {
    const dueDate = $('followDate').value;
    if (!dueDate) {
      toast('Follow-up date required.', 'error');
      return;
    }
    let expectedValue = Number($('followExpectedValue').value || 0);
    if (!Number.isFinite(expectedValue) || expectedValue < 0) {
      toast('Expected value must be zero or more.', 'error');
      return;
    }
    if (!expectedValue && out === 'Non Purchase') expectedValue = staged.lostValue || 0;
    followupDraft = {
      id: uid('fu'),
      customerId: c.id,
      queueNo: c.queueNo,
      customerName: c.name,
      mobile: c.mobile,
      croId: c.assignedCroId,
      dueDate,
      expectedValue,
      lastContactAt: null,
      contactCount: 0,
      mode: $('followMode').value,
      notes: $('followNotes').value.trim(),
      status: 'Pending',
      createdAt: new Date().toISOString()
    };
  }

  Object.assign(c, staged);
  if (followupDraft) state.followups.push(followupDraft);
  c.outcome = out;
  c.notes = $('closeNotes').value.trim();
  c.closedAt = new Date().toISOString();
  c.closedBy = role;
  c.status = 'Closed';
  if (!c.exitTime) c.exitTime = new Date().toISOString();
  tryFillFromWaiting();
  if (!save('lead.close', { queueNo: c.queueNo, outcome: out, followup: followupRequired, reasonCode: staged.lostReasonCode || staged.conversionReasonCode || null })) return;
  closeModal();
  toast('Lead closed.', 'success');
}

/* ===== Contact actions: tap-to-call + WhatsApp. Message text comes from the shell's WA_CFG.qms
   template registry (thank-you / post-purchase / service / winback), matched to the customer's
   outcome via each template's ok() predicate. Offline-safe: only tel: and wa.me links. ===== */
function qmsTel10(m){const d=String(m||'').replace(/\D/g,'');return d.length>=10?d.slice(-10):''}
function qmsWaMsgFor(c){try{const cfg=window.parent&&SaagarModuleBridge.waConfig&&SaagarModuleBridge.waConfig.qms;const tpls=((cfg&&cfg.templates)||[]).filter(t=>{try{return !t.ok||t.ok(c)}catch(e){return false}});const t=tpls.find(x=>x.id!=='thanks')||tpls[0];if(t)return t.build(c)}catch(e){}return 'Namaste '+((c&&c.name)||'')+',\nThank you for visiting Saagar Traders, Latur.'}
function qmsWaLink(url,scopeId,purposeId){if(window.parent&&window.parent!==window){window.parent.postMessage({type:'ST_WA_LINK',url:url,scopeId:scopeId,purposeId:purposeId},SaagarModuleRuntime.targetOrigin);return}toast('Controlled WhatsApp is available only inside Saagar Control Centre.','error')}
function qmsWaCust(id){const c=customerById(id);if(!c)return;const d=qmsTel10(c.mobile);if(!d){toast('No valid mobile number.','error');return}qmsWaLink('https://wa.me/91'+d+'?text='+encodeURIComponent(qmsWaMsgFor(c)),'qms-customer-message','customer-relationship-message')}
function qmsWaFu(id){const f=state.followups.find(x=>x.id===id);if(!f)return;const d=qmsTel10(f.mobile);if(!d){toast('No valid mobile number.','error');return}const c=customerById(f.customerId)||{name:f.customerName};qmsWaLink('https://wa.me/91'+d+'?text='+encodeURIComponent(qmsWaMsgFor(c)),'qms-followup-message','promotional-customer-message')}
function contactBtns(mobile,fn,id){const d=qmsTel10(mobile);if(!d)return '';return `<span style="display:inline-flex;gap:4px;vertical-align:middle;margin-left:6px"><a class="btn xs ghost" style="text-decoration:none;padding:2px 7px" href="tel:+91${d}" title="Call">📞</a><button data-action="btn-xs-ghost" data-action-key="definition-01" class="btn xs ghost" style="padding:2px 7px" onclick="${fn}('${id}')" title="WhatsApp">📲</button></span>`}
function renderReports(){const daily=calcStats(),weekly=rangeStats(7),monthly=rangeStats(31);$('view-reports').innerHTML=`<div class="page-header"><div class="page-header-left"><h1>Reports</h1><p>Daily, weekly and monthly performance</p></div><div class="page-header-actions"><button data-action="shareeodsummary" class="btn gold" onclick="shareEodSummary()">Share Day Summary</button><button data-action="printreports" class="btn" onclick="printReports()">Print</button><button data-action="exportcsv" class="btn primary" onclick="exportCSV()">Export CSV</button></div></div><div class="grid-3" style="margin-bottom:16px">${reportCard('Today',daily)}${reportCard('Last 7 Days',weekly)}${reportCard('Last 31 Days',monthly)}</div><div class="grid-2" style="margin-bottom:16px"><div class="card"><div class="card-head"><div><div class="card-title">CRO Performance</div><div class="card-sub">Today</div></div></div><div class="card-body" style="padding:0">${croPerformanceTable()}</div></div><div class="card"><div class="card-head"><div><div class="card-title">Non-Purchase Reasons</div><div class="card-sub">Lost sale analysis · active records</div></div></div><div class="card-body">${lostReasonReport()}</div></div></div><div class="card" style="margin-bottom:16px"><div class="card-head"><div><div class="card-title">Lost ₹</div><div class="card-sub">Estimated lost value · non-purchase closures</div></div></div><div class="card-body">${lostValueReport(daily,weekly,monthly)}</div></div><div class="card" style="margin-bottom:16px"><div class="card-head"><div><div class="card-title">Follow-up Recovered ₹</div><div class="card-sub">Recovered value · converted follow-ups</div></div></div><div class="card-body">${recoveredValueReport(daily,weekly,monthly)}</div></div><div class="grid-2" style="margin-bottom:16px"><div class="card"><div class="card-head"><div><div class="card-title">Skip Reasons</div><div class="card-sub">Turn skips today · by reason</div></div></div><div class="card-body">${skipReasonReport()}</div></div><div class="card"><div class="card-head"><div><div class="card-title">Waiting &amp; Service Summary</div><div class="card-sub">Queue pressure today</div></div></div><div class="card-body">${waitingSummaryCard()}</div></div></div><div class="card"><div class="card-head"><div><div class="card-title">Audit Trail</div><div class="card-sub">Recent operations</div></div></div><div class="card-body" style="max-height:400px;overflow-y:auto">${state.audit.slice(0,80).map(a=>`<div class="audit-item"><span class="audit-time">${fmtDT(a.at)}</span><div><div class="audit-action">${esc(a.action)}</div><div class="audit-detail">${esc(JSON.stringify(a.details||{}))}</div></div><span class="badge gray">${esc(a.role)}</span></div>`).join('')||'<div class="empty-state"><p>No audit records yet</p></div>'}</div></div>`}
function rangeStats(days){const since=new Date();since.setDate(since.getDate()-days+1);/* Audit fix qms-bug-01: zero time-of-day so the oldest day's early entries aren't dropped (compare by local date start, not raw ms) */since.setHours(0,0,0,0);return calcStats(state.customers.filter(c=>new Date(c.entryTime)>=since))}
function reportCard(title,s){return`<div class="report-card"><h4>${title}</h4><div class="report-row"><span class="rk">Walk-ins</span><span class="rv">${s.total}</span></div><div class="report-row"><span class="rk">Purchase / Service / Non</span><span class="rv">${s.pur} / ${s.svc} / ${s.non}</span></div><div class="report-row"><span class="rk">Sales</span><span class="rv">₹${s.sales.toLocaleString('en-IN')}</span></div><div class="report-row"><span class="rk">Conversion</span><span class="rv">${s.conv}%</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,s.conv)}%"></div></div></div>`}
function croPerfRows(rot){const pcMap=preclaimStatsByCro();return state.cros.filter(c=>c.active).map(c=>{const list=todaysCustomers().filter(x=>x.assignedCroId===c.id),pur=list.filter(x=>x.outcome==='Purchase'),skips=(rot?.turnEvents||[]).filter(e=>e.expectedCroId===c.id).length;const turns=todaysCustomers().filter(x=>x.assignedCroId===c.id&&x.expectedCroId===c.id).length;const pc=pcMap[c.id]||{honored:0,missed:0};const off=rot?isOffFloor(rotationItem(rot,c.id)):false;const free=rot?isFreeOnFloor(rot,c.id):false;const now=off?{cls:'gray',txt:'Off floor'}:(!free?{cls:'blue',txt:'Busy'}:{cls:'green',txt:'Free'});return{name:c.name,turns,total:list.length,pur:pur.length,sales:pur.reduce((s,x)=>s+(+x.purchaseAmount||0),0),conv:list.length?Math.round(pur.length/list.length*100):0,skips,pcHonored:+pc.honored||0,pcMissed:+pc.missed||0,now}})}
function croPerformanceTable(){const rot=currentRotation();const rows=croPerfRows(rot);return`<div class="tbl-wrap"><table class="tbl"><thead><tr><th>CRO</th><th>Turns</th><th>Assigned</th><th>Purchases</th><th>Conversion</th><th>Sales</th><th>Skipped</th><th>Pre-claims ✓</th><th>Pre-claims ✗</th><th>Now</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(r.name)}</b></td><td>${r.turns}</td><td>${r.total}</td><td>${r.pur}</td><td>${r.conv}%</td><td>₹${r.sales.toLocaleString('en-IN')}</td><td>${r.skips>0?`<span class="badge orange">${r.skips}</span>`:r.skips}</td><td>${r.pcHonored>0?`<span class="badge green">${r.pcHonored}</span>`:'—'}</td><td>${r.pcMissed>0?`<span class="badge orange">${r.pcMissed}</span>`:'—'}</td><td><span class="badge ${r.now.cls}">${r.now.txt}</span></td></tr>`).join('')}</tbody></table></div>`}
function lostReasonReport(){const rows={};state.customers.filter(c=>c.outcome==='Non Purchase').forEach(c=>rows[c.lostReason||'Not specified']=(rows[c.lostReason||'Not specified']||0)+1);const max=Math.max(1,...Object.values(rows)),items=Object.entries(rows).sort((a,b)=>b[1]-a[1]);if(!items.length)return'<div class="empty-state"><p>No non-purchase cases yet</p></div>';return items.map(([k,v])=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12.5px;font-weight:500;color:var(--ink2)">${esc(k)}</span><span style="font-size:12px;font-weight:700;color:var(--ink)">${v}</span></div><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%;background:var(--gold)"></div></div></div>`).join('')}
/* ===== V6 Wave 1: Lost ₹ KPI — renders lostValue/lostReason already captured on Non Purchase
   closures (confirmCloseLead). Totals come from calcStats' additive lost field (same Today/7d/31d
   windows as the report cards); top lost leads = highest lostValue in the last 31 days. Render-only. ===== */
function lostValueReport(d,w,m){const since=new Date();since.setDate(since.getDate()-30);const top=state.customers.filter(c=>c.outcome==='Non Purchase'&&(+c.lostValue||0)>0&&new Date(c.entryTime)>=since).sort((a,b)=>(+b.lostValue||0)-(+a.lostValue||0)).slice(0,5);return`<div class="report-row"><span class="rk">Today</span><span class="rv">₹${d.lost.toLocaleString('en-IN')}</span></div><div class="report-row"><span class="rk">Last 7 Days</span><span class="rv">₹${w.lost.toLocaleString('en-IN')}</span></div><div class="report-row"><span class="rk">Last 31 Days</span><span class="rv">₹${m.lost.toLocaleString('en-IN')}</span></div>${top.length?`<div style="margin-top:12px"><div style="font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:6px">Top Lost Leads · last 31 days</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Customer</th><th>Mobile</th><th>Lost ₹</th><th>Reason</th></tr></thead><tbody>${top.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td class="mono">${esc(c.mobile||'—')}</td><td>₹${(+c.lostValue||0).toLocaleString('en-IN')}</td><td>${esc(c.lostReason||'Not specified')}</td></tr>`).join('')}</tbody></table></div></div>`:'<div class="empty-state" style="margin-top:8px"><p>No lost value recorded yet</p></div>'}`}
/* ===== Phase 6: Skip-reason analytics — buckets today's turnEvents (skipped:true) by reason.
   View-date correct: currentRotation() resolves to the viewAsOf day's rotation. Render-only. ===== */
function skipReasonReport(){const rot=currentRotation();const ev=(rot&&Array.isArray(rot.turnEvents))?rot.turnEvents:[];const rows={};ev.filter(e=>e&&e.skipped).forEach(e=>{const k=e.reason||'Not specified';rows[k]=(rows[k]||0)+1;});const items=Object.entries(rows).sort((a,b)=>b[1]-a[1]);if(!items.length)return'<div class="empty-state"><p>No skips recorded today</p></div>';const max=Math.max(1,...items.map(x=>x[1]));return items.map(([k,v])=>`<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span style="font-size:12.5px;font-weight:500;color:var(--ink2)">${esc(k)}</span><span style="font-size:12px;font-weight:700;color:var(--ink)">${v}</span></div><div class="bar-track"><div class="bar-fill" style="width:${v/max*100}%;background:var(--gold)"></div></div></div>`).join('')}
/* ===== Phase 6: Waiting / service summary — queue pressure today. Wait-time math counts only
   customers with attendStart (consistent with calcStats); currentlyWaiting counts status==='Waiting'
   even without attendStart, so the two reconcile separately. avgWait reuses calcStats(). ===== */
function waitingSummary(){const list=todaysCustomers();const waits=list.filter(c=>c.attendStart).map(c=>minsBetween(c.entryTime,c.attendStart));const maxWait=waits.length?Math.max(...waits):0;const currentlyWaiting=list.filter(c=>c.status==='Waiting').length;return{total:list.length,currentlyWaiting,maxWait,avgWait:calcStats(list).avgWait};}
function waitingSummaryCard(){const s=waitingSummary();return`<div class="report-row"><span class="rk">Walk-ins today</span><span class="rv">${+s.total||0}</span></div><div class="report-row"><span class="rk">Currently waiting</span><span class="rv">${+s.currentlyWaiting||0}</span></div><div class="report-row"><span class="rk">Max wait (min)</span><span class="rv">${+s.maxWait||0}</span></div><div class="report-row"><span class="rk">Avg wait (min)</span><span class="rv">${+s.avgWait||0}</span></div>`;}
/* ===== Print bridge: rebuilds the Reports view as a self-contained .stp-* print document.
   Reuses module data (calcStats / rangeStats / croPerformanceTable's source / lostReasonReport's
   source / skipReasonReport's source / waitingSummary). Markup is rebuilt with shared theme classes. ===== */
function printReports(){
  const daily=calcStats(),weekly=rangeStats(7),monthly=rangeStats(31);
  const inr=n=>'₹'+(+n||0).toLocaleString('en-IN');
  // ---- summary cards (mirror reportCard figures) ----
  const card=(title,s)=>`<div class="stp-card"><h4>${stEsc(title)}</h4>`+
    `<div class="v">${stEsc(s.total)}</div>`+
    `<div class="stp-mut">Walk-ins</div>`+
    `<div class="stp-mut">P/S/N: ${stEsc(s.pur)} / ${stEsc(s.svc)} / ${stEsc(s.non)}</div>`+
    `<div class="stp-mut">Sales: ${stEsc(inr(s.sales))}</div>`+
    `<div class="stp-mut">Conversion: ${stEsc(s.conv)}%</div></div>`;
  const cards=`<div class="stp-cards">${card('Today',daily)}${card('Last 7 Days',weekly)}${card('Last 31 Days',monthly)}</div>`;
  // ---- CRO performance (today) — rebuild rows from same source as croPerformanceTable() ----
  const pcMap=preclaimStatsByCro();const rot=currentRotation();
  const croRows=state.cros.filter(c=>c.active).map(c=>{
    const list=todaysCustomers().filter(x=>x.assignedCroId===c.id);
    const pur=list.filter(x=>x.outcome==='Purchase');
    const skips=(rot&&rot.turnEvents?rot.turnEvents:[]).filter(e=>e.expectedCroId===c.id).length;
    const turns=todaysCustomers().filter(x=>x.assignedCroId===c.id&&x.expectedCroId===c.id).length;
    const pc=pcMap[c.id]||{honored:0,missed:0};
    const off=rot?isOffFloor(rotationItem(rot,c.id)):false;
    const free=rot?isFreeOnFloor(rot,c.id):false;
    const now=off?'Off floor':(!free?'Busy':'Free');
    return{name:c.name,turns,total:list.length,pur:pur.length,sales:pur.reduce((s,x)=>s+(+x.purchaseAmount||0),0),conv:list.length?Math.round(pur.length/list.length*100):0,skips,pcHonored:+pc.honored||0,pcMissed:+pc.missed||0,now};
  });
  const croBody=croRows.length?croRows.map(r=>`<tr><td class="stp-c">${stEsc(r.name)}</td><td class="stp-r">${stEsc(r.turns)}</td><td class="stp-r">${stEsc(r.total)}</td><td class="stp-r">${stEsc(r.pur)}</td><td class="stp-r">${stEsc(r.conv)}%</td><td class="stp-r">${stEsc(inr(r.sales))}</td><td class="stp-r">${stEsc(r.skips)}</td><td class="stp-r">${stEsc(r.pcHonored)}</td><td class="stp-r">${stEsc(r.pcMissed)}</td><td class="stp-c">${stEsc(r.now)}</td></tr>`).join(''):`<tr><td class="stp-c" colspan="10"><span class="stp-mut">No active CROs</span></td></tr>`;
  const croSec=`<div class="stp-sec"><div class="stp-sec-t">CRO Performance (Today)</div><table class="stp-table"><thead><tr><th>CRO</th><th class="stp-r">Turns</th><th class="stp-r">Assigned</th><th class="stp-r">Purchases</th><th class="stp-r">Conversion</th><th class="stp-r">Sales</th><th class="stp-r">Skipped</th><th class="stp-r">Pre-claims ✓</th><th class="stp-r">Pre-claims ✗</th><th>Now</th></tr></thead><tbody>${croBody}</tbody></table></div>`;
  // ---- Non-purchase reasons — same source as lostReasonReport() ----
  const lostMap={};state.customers.filter(c=>c.outcome==='Non Purchase').forEach(c=>{const k=c.lostReason||'Not specified';lostMap[k]=(lostMap[k]||0)+1;});
  const lostItems=Object.entries(lostMap).sort((a,b)=>b[1]-a[1]);
  const lostBody=lostItems.length?lostItems.map(([k,v])=>`<tr><td class="stp-c">${stEsc(k)}</td><td class="stp-r">${stEsc(v)}</td></tr>`).join(''):`<tr><td class="stp-c" colspan="2"><span class="stp-mut">No non-purchase cases yet</span></td></tr>`;
  const lostSec=`<div class="stp-sec"><div class="stp-sec-t">Non-Purchase Reasons</div><table class="stp-table"><thead><tr><th>Reason</th><th class="stp-r">Count</th></tr></thead><tbody>${lostBody}</tbody></table></div>`;
  // ---- Skip reasons — same source as skipReasonReport() ----
  const skEv=(rot&&Array.isArray(rot.turnEvents))?rot.turnEvents:[];const skMap={};
  skEv.filter(e=>e&&e.skipped).forEach(e=>{const k=e.reason||'Not specified';skMap[k]=(skMap[k]||0)+1;});
  const skItems=Object.entries(skMap).sort((a,b)=>b[1]-a[1]);
  const skBody=skItems.length?skItems.map(([k,v])=>`<tr><td class="stp-c">${stEsc(k)}</td><td class="stp-r">${stEsc(v)}</td></tr>`).join(''):`<tr><td class="stp-c" colspan="2"><span class="stp-mut">No skips recorded today</span></td></tr>`;
  const skSec=`<div class="stp-sec"><div class="stp-sec-t">Skip Reasons (Today)</div><table class="stp-table"><thead><tr><th>Reason</th><th class="stp-r">Count</th></tr></thead><tbody>${skBody}</tbody></table></div>`;
  // ---- Waiting summary — same source as waitingSummaryCard() ----
  const ws=waitingSummary();
  const wsSec=`<div class="stp-sec"><div class="stp-sec-t">Waiting & Service Summary (Today)</div><table class="stp-table"><tbody>`+
    `<tr><td class="stp-c">Walk-ins today</td><td class="stp-r">${stEsc(+ws.total||0)}</td></tr>`+
    `<tr><td class="stp-c">Currently waiting</td><td class="stp-r">${stEsc(+ws.currentlyWaiting||0)}</td></tr>`+
    `<tr><td class="stp-c">Max wait (min)</td><td class="stp-r">${stEsc(+ws.maxWait||0)}</td></tr>`+
    `<tr><td class="stp-c">Avg wait (min)</td><td class="stp-r">${stEsc(+ws.avgWait||0)}</td></tr>`+
    `</tbody></table></div>`;
  const store=(state.settings&&state.settings.storeName)||'Saagar Traders';
  const head=`<div class="stp-head"><div class="stp-brand">Saagar Traders<small>Queue Management</small></div><div class="stp-title">QMS Report<small>Daily / Weekly / Monthly Report</small></div></div>`+
    `<div class="stp-meta"><span>Store: ${stEsc(store)}</span> · <span>As of: ${stEsc(viewAsOf)}</span> · <span>Generated: ${stEsc(new Date().toLocaleString('en-IN'))}</span></div>`;
  const body=head+cards+croSec+lostSec+skSec+wsSec+`<div class="stp-foot">Generated by QMS · Saagar Traders</div>`;
  stPrintDoc({title:'QMS Reports',fileBase:'QMS-Reports',body,orientation:'portrait'});
}
function renderSettings(){$('view-settings').innerHTML=`<div class="page-header"><div class="page-header-left"><h1>Settings</h1><p>System configuration, data management and CRO master list</p></div></div><div class="grid-2" style="margin-bottom:16px"><div class="card"><div class="card-head"><div><div class="card-title">Store & Queue Settings</div></div></div><div class="card-body">${settingRows()}</div></div><div class="card"><div class="card-head"><div><div class="card-title">Data & Backup</div></div></div><div class="card-body"><div class="toggle-row"><div class="toggle-info"><strong>Records</strong><span>${state.customers.length} customers, ${state.followups.length} follow-ups, ${state.audit.length} audit logs</span></div></div><div class="toggle-row"><div class="toggle-info"><strong>Last Backup</strong><span>${state.lastBackup?fmtDT(state.lastBackup):'Never'}</span></div></div></div><div class="card-foot"><button data-action="backupdata" class="btn green" onclick="backupData()">Download Backup</button><button data-action="template-action" data-action-key="definition-01" class="btn gold" onclick="$('restoreInput').click()">Restore</button><button data-action="resetdemo" class="btn" style="color:var(--red);border-color:#fca5a5;margin-left:auto" onclick="resetDemo()">Reset All</button></div></div></div><div class="card"><div class="card-head"><div><div class="card-title">CRO Master</div><div class="card-sub">Active CROs available for daily rotation</div></div><button data-action="addcrotomaster" data-action-key="definition-02" class="btn primary" onclick="addCroToMaster()">Add CRO</button></div><div class="card-body" style="padding:0">${croMasterTable()}</div></div>`}
function settingRows(){const s=state.settings,rows=[['storeName','Store Name','text'],['ownerWhatsApp','Owner WhatsApp (10-digit)','text'],['queuePrefix','Queue Number Prefix','text'],['waitAlertMins','Waiting Alert (minutes)','number'],['autoAllocate','Auto-allocate CRO by rotation','bool'],['requireBillForPurchase','Bill No. required for Purchase','bool'],['requireJobForService','Job Card required for Service','bool'],['allowGreeterClose','Allow Greeter to close leads','bool'],['smCanGiveNextOpportunity','SM can give next opportunity','bool'],['lockEditsAfterEOD','Lock edits after EOD','bool']];return rows.map(([key,label,type])=>`<div class="toggle-row"><div class="toggle-info"><strong>${label}</strong>${type!=='bool'?`<span>${esc(String(s[key]))}</span>`:''}</div>${type==='bool'?`<label class="switch"><input data-action="updatesetting" data-action-key="definition-01" type="checkbox" ${s[key]?'checked':''} onchange="updateSetting('${key}',this.checked)"><div class="switch-track"></div><div class="switch-thumb"></div></label>`:`<input data-action="updatesetting" data-action-key="definition-02" class="input setting-input" type="${type}" value="${esc(s[key])}" onchange="updateSetting('${key}',this.value)">`}</div>`).join('')}
function updateSetting(key, value) {
  if (!guardPast()) return false;
  if (!requireSM()) return false;
  if (key === 'waitAlertMins') value = +value || 10;
  state.settings[key] = value;
  return save('settings.update', { key, value });
}
function croMasterTable(){return`<div class="tbl-wrap"><table class="tbl" id="croMasterTbl"><thead><tr><th>Name</th><th>Code</th><th>Status</th><th>Actions</th></tr></thead><tbody>${state.cros.map(c=>`<tr><td class="name-cell" data-label="Name"><b>${esc(c.name)}</b></td><td class="mono" data-label="Code" style="font-size:12px">${esc(c.code||'—')}</td><td data-label="Status"><span class="badge ${c.active?'green':'red'}">${c.active?'Active':'Inactive'}</span></td><td class="gm-del-cell" data-label="Actions"><div style="display:flex;gap:5px"><button data-action="editcro" data-action-key="definition-01" class="btn sm" onclick="editCro('${c.id}')">Edit</button><button data-action="togglecro" data-action-key="definition-01" class="btn sm" style="color:${c.active?'var(--red)':'var(--green)'};border-color:${c.active?'#fca5a5':'#a7f3d0'}" onclick="toggleCro('${c.id}')">${c.active?'Deactivate':'Activate'}</button></div></td></tr>`).join('')}</tbody></table></div>`}
function editCro(id){if(!guardPast())return;const c=state.cros.find(x=>x.id===id);if(!c)return;openModal('Edit CRO',`<div class="field full" style="margin-bottom:12px"><label class="label">Name</label><input class="input" id="editCroName" value="${esc(c.name)}"></div><div class="field full"><label class="label">Code</label><input class="input" id="editCroCode" value="${esc(c.code||'')}"></div>`,`<button data-action="closemodal" data-action-key="definition-11" class="btn ghost" onclick="closeModal()">Cancel</button><button data-action="confirmeditcro" data-action-key="definition-01" class="btn primary" onclick="confirmEditCro('${id}')">Save</button>`,true)}
function confirmEditCro(id){if(!guardPast())return;const c=state.cros.find(x=>x.id===id);if(!c)return;c.name=$('editCroName').value.trim()||c.name;c.code=$('editCroCode').value.trim();if(!save('cro.edit',{id}))return;closeModal();toast('CRO updated.','success')}
function toggleCro(id){if(!guardPast())return;if(!requireSM())return;const c=state.cros.find(x=>x.id===id);if(!c)return;c.active=!c.active;if(!save('cro.toggle',{id,active:c.active}))return;toast(`${c.name} ${c.active?'activated':'deactivated'}.`)}
function backupData(){if(!guardPast())return;state.lastBackup=new Date().toISOString();localStorage.setItem(STORE_KEY,JSON.stringify(state));const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});if(window.parent&&window.parent!==window){window.parent.postMessage({type:'ST_SHARE',file:blob,fileName:`qms-backup-${todayISO()}.json`,title:'QMS backup',exportId:'qms-backup-export',scopeId:'qms-full-state',scopeLabel:'QMS full-state backup',rowCount:state.customers.length,purposeId:'business-continuity'},SaagarModuleRuntime.targetOrigin);renderAll();return}toast('Controlled export is available only inside Saagar Control Centre.','error')}
function restoreData(file){if(!guardPast())return;if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!data.settings||!Array.isArray(data.customers))throw new Error('Invalid');state=data;localStorage.setItem(STORE_KEY,JSON.stringify(state));load();renderAll();toast('Backup restored.','success')}catch(e){toast('Invalid backup file.','error')}};r.readAsText(file)}
function resetDemo(){if(!guardPast())return;if(!requireSM())return;if(!confirm('Delete all QMS data in this browser? This cannot be undone.'))return;state=initialState();localStorage.setItem(STORE_KEY,JSON.stringify(state));load();renderAll();toast('System reset.','warn')}
function closeEOD(){if(!guardPast())return;if(!requireSM())return;if(!currentRotation()){toast("No active rotation to close.","warn");return;}const rot=currentRotation(),open=todaysCustomers().filter(c=>c.status!=='Closed');if(open.length&&!confirm(`${open.length} lead(s) still open. Close EOD anyway?`))return;rot.status='Closed';rot.closedAt=new Date().toISOString();rot.closedBy=role;state.preclaims.forEach(p=>{if(p&&p.status==='Active'&&(p.date||'')===todayISO())p.status='Expired';});if(!save('eod.close',{date:todayISO(),open:open.length}))return;toast('EOD closed.','success');offerEodShare()}
/* ===== W2-7: EOD owner summary — one-tap share of the day's pulse (PDF via the shell SaagarReport
   engine, payroll ST_REPORT pattern; plus a wa.me plain-text quick send). READ-ONLY: every number
   comes from the SAME functions the Dashboard/Reports render — calcStats() for the KPI row and
   croPerfRows() (extracted from the Reports CRO Performance table) for the per-CRO table; lost
   reasons group the exact list calcStats' lost field sums (todaysCustomers, outcome Non Purchase).
   Not in RO_MUTATORS by design: re-sharing a past or already-closed day is allowed. ===== */
function rotationForSummary(){const rots=state.rotations.filter(r=>r.date===viewAsOf);return rots.find(r=>r.status==='Active')||rots[rots.length-1]||null}
function eodLostReasons(){const m={};todaysCustomers().filter(c=>c.outcome==='Non Purchase').forEach(c=>{const k=c.lostReason||'Not specified';if(!m[k])m[k]={reason:k,count:0,value:0};m[k].count++;m[k].value+=(+c.lostValue||0)});return Object.values(m).sort((a,b)=>b.count-a.count)}
function eodSummaryData(){const s=calcStats();const rot=rotationForSummary();const rows=croPerfRows(rot);return{date:viewAsOf,store:(state.settings&&state.settings.storeName)||'Saagar Traders',closedAt:(rot&&rot.closedAt)||null,closedBy:(rot&&rot.closedBy)||null,kpi:{walkins:s.total,purchases:s.pur,service:s.svc,non:s.non,conv:s.conv,sales:s.sales,lost:s.lost,avgWait:s.avgWait},lostReasons:eodLostReasons(),cros:rows.map(r=>({name:r.name,turns:r.turns,assigned:r.total,purchases:r.pur,conv:r.conv,sales:r.sales,skips:r.skips}))}}
function shareEodSummary(){try{const opts=eodSummaryData();if(window.parent&&window.parent!==window){window.parent.postMessage({type:'ST_REPORT',reportType:'qmsEodSummary',opts:opts},SaagarModuleRuntime.targetOrigin);return;}if(SaagarModuleBridge.report&&SaagarModuleBridge.report.preview){SaagarModuleBridge.report.preview('qmsEodSummary',opts);return;}toast('Report engine unavailable on this build.','error');}catch(e){toast('Could not open summary: '+((e&&e.message)||e),'error');}}
function waEodSummary(){try{const d=eodSummaryData();const L=['*'+d.store+' — Day Summary ('+d.date+')*','Walk-ins: '+d.kpi.walkins+' | Purchases: '+d.kpi.purchases+' ('+d.kpi.conv+'%)','Sales: ₹'+d.kpi.sales.toLocaleString('en-IN'),'Lost: ₹'+d.kpi.lost.toLocaleString('en-IN')+(d.lostReasons[0]?' | Top: '+d.lostReasons[0].reason+' ('+d.lostReasons[0].count+')':'')];if(d.cros.length){L.push('');L.push('*CRO performance*');d.cros.forEach(r=>L.push(r.name+': '+r.turns+' turns, '+r.purchases+' buy ('+(r.assigned?r.conv+'%':'—')+'), ₹'+r.sales.toLocaleString('en-IN')+(r.skips?', '+r.skips+' skip(s)':'')));}const digits=qmsTel10((state.settings&&state.settings.ownerWhatsApp)||'');const url=digits?('https://wa.me/91'+digits+'?text='):('https://wa.me/?text=');qmsWaLink(url+encodeURIComponent(L.join('\n')),'qms-eod-summary','owner-operational-summary');}catch(e){toast('Could not build summary text.','error');}}
function offerEodShare(){openModal('Day closed — share summary?',`<div class="info-note" style="margin-bottom:14px">Send today's pulse to the owner: walk-ins, conversion %, sales ₹, lost ₹ + top reason, and the per-CRO table.</div>`,`<button data-action="closemodal" data-action-key="definition-12" class="btn ghost" onclick="closeModal()">Later</button><button data-action="closemodal" data-action-key="definition-13" class="btn" onclick="closeModal();waEodSummary()">📲 WhatsApp text</button><button data-action="closemodal" data-action-key="definition-14" class="btn primary" onclick="closeModal();shareEodSummary()">Share PDF</button>`,true)}
function exportCSV(){const headers=['Date','Queue No','Name','Mobile','Visit Type','Entry','Allocated CRO','Attend Start','Exit','Outcome','Amount','Lost Reason','Status'],rows=state.customers.map(c=>[customerBusinessDate(c),c.queueNo,c.name,c.mobile,c.visitType,fmtDT(c.entryTime),croName(c.assignedCroId),fmtDT(c.attendStart),fmtDT(c.exitTime),c.outcome||'',c.purchaseAmount||'',c.lostReason||'',c.status]),csv=[headers,...rows].map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n'),blob=new Blob([csv],{type:'text/csv'});if(window.parent&&window.parent!==window){window.parent.postMessage({type:'ST_SHARE',file:blob,fileName:`qms-active-customers-${todayISO()}.csv`,title:'QMS active customers',exportId:'qms-active-csv',scopeId:'qms-active-customers',scopeLabel:'QMS active customer register',rowCount:rows.length,purposeId:'register-reporting'},SaagarModuleRuntime.targetOrigin);return}toast('Controlled export is available only inside Saagar Control Centre.','error')}
/* ===== View-date rail wiring ===== */
function normAsOf(v){return(typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v))?v:null;}
function setViewAsOf(d){const nd=normAsOf(d)||todayISO();if(nd===viewAsOf)return;viewAsOf=nd;if(typeof renderAll==='function')renderAll();}
window.addEventListener('st-date',function(e){const d=e&&e.detail;const cand=(d&&typeof d==='object')?(d.date||d.asOf||d.value):d;setViewAsOf(normAsOf(cand)||readAsOf());});
load();viewAsOf=readAsOf();tick();renderAll();
</script>
